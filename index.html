 that everyone deserves accessible, practical tools for managing everyday mental and emotional challenges — whether or not they're currently working with a therapist. We hope you've found it useful, and we're always here if you'd like additional support.<\/p>\n<div class=\"callout\"><p><strong>Get in Touch<\/strong><\/p>\n<p>Call MindShift Psychological Services at (714) 584-9700 to ask questions, request more resources, or schedule an appointment (Feel free to call or text anytime of the day!)<\/p>\n<p>If you would like to meditate with us, please visit <a href=\"https://mindshiftwellnesscenter.com/meditation-videos/\"><strong>https://mindshiftwellnesscenter.com/meditation-videos/<\/strong><\/a><\/p><\/div>\n<h2><strong>Ways to Keep Building on What You've Learned<\/strong><\/h2>\n<ul>\n<li><p>Revisit the exercises in this guide regularly, not just when anxiety feels intense<\/p><\/li>\n<li><p>Share the daily anchor routine or journaling prompts with someone you trust<\/p><\/li>\n<li><p>Consider individual therapy if you'd like more personalized, ongoing support<\/p><\/li>\n<li><p>Be patient with yourself — building new patterns takes practice and repetition<\/p><\/li>\n<\/ul>"}, {"title": "A Final Word", "html": "<p>Managing anxiety is not about becoming someone who never feels anxious again. It's about building a steadier relationship with your mind and body — learning to recognize what's happening, responding with tools that work for you, and treating yourself with the same compassion you'd offer someone you care about.<\/p>\n<p>You won't get it perfect every time, and that's completely okay. Every time you practice one of these skills — even imperfectly — you're building a little more resilience for the next time anxiety shows up.<\/p>\n<p>We hope this guide has given you a starting place. Revisit it as often as you need, and remember that support is always available.<\/p>\n<p><strong>MindShift Psychological Services<\/strong><\/p>\n<p>(714) 584-9700<\/p>\n<p><em>You don't have to navigate this alone.<\/em><\/p>"}]</script>

const CHEERS = {

  small: ["Nice work.", "One more step forward.", "Keep going, you're doing it.", "That counts."],

};
const CONFETTI_COLORS = ["#688A74", "#1F3A5F", "#AA7048", "#E3B04B", "#DDE7DF"];
function fireConfetti(level) {
  try {
    if (!window.confetti) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const base = { colors: CONFETTI_COLORS, disableForReducedMotion: true, zIndex: 60, ticks: 220 };
    if (level === "big") {
      window.confetti({ ...base, particleCount: 90, spread: 70, angle: 60, origin: { x: 0, y: 0.75 }, startVelocity: 55 });
      window.confetti({ ...base, particleCount: 90, spread: 70, angle: 120, origin: { x: 1, y: 0.75 }, startVelocity: 55 });
      setTimeout(() => window.confetti({ ...base, particleCount: 60, spread: 100, origin: { x: 0.5, y: 0.35 }, scalar: 0.9 }), 250);
    } else if (level === "gentle") {
      window.confetti({ ...base, colors: ["#DDE7DF", "#B9CFC0", "#F3E6D8", "#C9D6EA", "#FFFFFF"], particleCount: 45, spread: 90, origin: { x: 0.5, y: 0.95 }, startVelocity: 28, gravity: 0.55, drift: 0.2, scalar: 0.75, ticks: 320 });
    } else {
      window.confetti({ ...base, particleCount: 40, spread: 60, origin: { x: 0.5, y: 0.9 }, startVelocity: 35, scalar: 0.8 });
    }
  } catch (e) {}
}

function MoodCheckIn({ moodWeek, setMoodWeek, todayMood, setTodayMood, say }) {
  const [score, setScore] = useState(null);
  const [tags, setTags] = useState([]);
  const [note, setNote] = useState("");
  const [editing, setEditing] = useState(!todayMood);
  const TAGS = ["Slept well", "Poor sleep", "Work stress", "Connected", "Lonely", "Exercised", "Anxious", "Calm"];
  const submit = () => {
    const m = { score, tags, note };
    setTodayMood(m); setMoodWeek(moodWeek.map((v, i) => (i === 6 ? score : v))); setEditing(false); say(score <= 2 ? "Thank you for checking in on a hard day" : "Check-in saved", score <= 2 ? "gentle" : "small");
  };
  const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const W = 300, H = 92, px = (i) => 14 + i * ((W - 28) / 6), py = (v) => H - 14 - ((v - 1) / 4) * (H - 28);
  const pts = moodWeek.map((v, i) => (v ? [px(i), py(v)] : null)).filter(Boolean);
  const line = pts.map((q, i) => `${i ? "L" : "M"}${q[0]},${q[1]}`).join(" ");
  const area = pts.length ? `${line} L${pts[pts.length - 1][0]},${H - 14} L${pts[0][0]},${H - 14} Z` : "";
  return (
    <Card className="lg:col-span-2 p-5 md:p-6 flex flex-col gap-4">
      <div className="flex items-baseline justify-between gap-3">
        <div>
          <p className="eyebrow text-muted">Mood check-in</p>
          <p className="font-display text-xl mt-1">How are you feeling today?</p>
        </div>
        {todayMood && !editing && <Btn variant="ghost" onClick={() => { setScore(todayMood.score); setTags(todayMood.tags); setNote(todayMood.note); setEditing(true); }}>Edit</Btn>}
      </div>
      <div className="grid md:grid-cols-5 gap-5">
        <div className="md:col-span-3 flex flex-col gap-4">
          {editing ? (
            <>
              <div className="grid grid-cols-5 gap-2" role="radiogroup" aria-label="Mood">
                {MOOD_LABELS.map((l, i) => {
                  const v = i + 1, on = score === v;
                  return (
                    <button key={l} role="radio" aria-checked={on} onClick={() => setScore(v)} className={`flex flex-col items-center gap-2 rounded-xl py-3 border transition ${on ? "border-primary bg-primary/5" : "border-line hover:bg-surface2"}`}>
                      <span className="rounded-full bg-sage" style={{ width: 10 + v * 5, height: 10 + v * 5, opacity: 0.35 + v * 0.13 }} />
                      <span className="text-[11px] font-semibold leading-tight text-center">{l}</span>
                    </button>
                  );
                })}
              </div>
              <div className="flex flex-wrap gap-1.5">
                {TAGS.map((t) => {
                  const on = tags.includes(t);
                  return <button key={t} onClick={() => setTags(on ? tags.filter((x) => x !== t) : [...tags, t])} aria-pressed={on} className={`rounded-full px-3 py-1 text-xs font-semibold border ${on ? "bg-sage text-white border-sage" : "border-line text-muted hover:text-ink"}`}>{t}</button>;
                })}
              </div>
              <input id="mood-note" className={inputCls} placeholder="Anything you want your therapist to know? (optional)" value={note} onChange={(e) => setNote(e.target.value)} />
              <div className="flex items-center gap-3">
                <Btn disabled={!score} onClick={submit}>Save check-in</Btn>
                <span className="text-xs text-muted flex items-center gap-1"><Ico name="lock" className="w-3.5 h-3.5" /> Saved only on this device</span>
              </div>
            </>
          ) : (
            <div className="rounded-xl bg-surface2 p-4 fade-in">
              <p className="text-sm text-muted">Today</p>
              <p className="font-display text-2xl">{MOOD_LABELS[todayMood.score - 1]}</p>
              {todayMood.tags.length > 0 && <div className="flex flex-wrap gap-1.5 mt-2">{todayMood.tags.map((t) => <Pill key={t} className="bg-surface text-muted">{t}</Pill>)}</div>}
              {todayMood.note && <p className="text-sm mt-2 italic">“{todayMood.note}”</p>}
            </div>
          )}
          {score && score <= 2 && (editing || todayMood) && (
            <div className="rounded-xl border border-danger/30 bg-dangersoft/60 p-4 text-sm fade-in">
              <p className="font-semibold">Thanks for being honest about a hard day.</p>
              <p className="mt-1">Your check-ins stay private on this device, so no one is notified. Consider adding this to your session summary. If you're thinking about harming yourself or feel unsafe, call or text <b>988</b> any time, or call <b>911</b>. You can also reach MindShift at <span className="tnum font-semibold">(714) 584-9700</span>.</p>
            </div>
          )}
        </div>
        <div className="md:col-span-2 flex flex-col gap-1">
          <p className="text-xs text-muted">This week</p>
          <svg viewBox={`0 0 ${W} ${H + 16}`} className="w-full" role="img" aria-label="Mood over the past 7 days">
            {[1, 3, 5].map((v) => <line key={v} x1="14" x2={W - 14} y1={py(v)} y2={py(v)} stroke="rgb(var(--line))" strokeDasharray="3 4" />)}
            {area && <path d={area} fill="rgb(var(--sage) / 0.14)" />}
            {line && <path d={line} fill="none" stroke="rgb(var(--sage))" strokeWidth="2.25" strokeLinejoin="round" />}
            {moodWeek.map((v, i) => v ? <circle key={i} cx={px(i)} cy={py(v)} r={i === 6 ? 5 : 3} fill={i === 6 ? "rgb(var(--primary))" : "rgb(var(--surface))"} stroke={i === 6 ? "rgb(var(--primary))" : "rgb(var(--sage))"} strokeWidth="2" /> :
              <circle key={i} cx={px(i)} cy={py(3)} r="4" fill="none" stroke="rgb(var(--muted))" strokeDasharray="2 2" />)}
            {days.map((d, i) => <text key={d} x={px(i)} y={H + 12} textAnchor="middle" fontSize="10" fill="rgb(var(--muted))" fontWeight={i === 6 ? 700 : 400}>{d}</text>)}
          </svg>
          <div className="flex justify-between text-[10px] text-muted"><span>1 = Very low</span><span>5 = Great</span></div>
        </div>
      </div>
    </Card>
  );
}

/* ---------- Therapy Logs (CBT Thought Record) ---------- */
const EMPTY = { situation: "", emotions: {}, thought: "", belief: 70, distortions: [], evFor: "", evAgainst: "", balanced: "", balancedBelief: 60, share: true };
function TherapyLogs({ logs, setLogs, say, ex, put }) {
  const [tab, setTab] = useState("new");
  const [f, setF] = useState(EMPTY);
  const [errors, setErrors] = useState({});
  const [fresh, setFresh] = useState(null);
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));
  const toggleEmotion = (e) => {
    const em = { ...f.emotions };
    if (em[e]) delete em[e]; else em[e] = { before: 60, after: 60 };
    set("emotions", em);
  };
  const setEm = (e, k, v) => set("emotions", { ...f.emotions, [e]: { ...f.emotions[e], [k]: v } });
  const toggleD = (d) => set("distortions", f.distortions.includes(d) ? f.distortions.filter((x) => x !== d) : [...f.distortions, d]);
  const save = () => {
    const e = {};
    if (!f.situation.trim()) e.situation = "Describe what happened, even briefly.";
    if (!Object.keys(f.emotions).length) e.emotions = "Pick at least one emotion.";
    if (!f.thought.trim()) e.thought = "Write the thought that went through your mind.";
    if (!f.balanced.trim()) e.balanced = "Try writing one more balanced thought.";
    setErrors(e);
    if (Object.keys(e).length) { say("A few fields still need attention"); return; }
    const id = Date.now();
    setLogs([{ ...f, id, date: nowStamp() }, ...logs]);
    setF(EMPTY); setFresh(id); setTab("saved"); say(f.share ? "Saved and added to your session summary" : "Saved on this device", "big");
  };
  const example = () => setF({
    situation: "Got invited to a coworker's birthday dinner Saturday.",
    emotions: { Anxious: { before: 75, after: 40 }, Embarrassed: { before: 50, after: 25 } },
    thought: "I'll say something awkward and everyone will notice.", belief: 80,
    distortions: ["Fortune telling", "Mind reading"],
    evFor: "I felt awkward at the team lunch in August.",
    evAgainst: "Two coworkers said they enjoyed talking with me. People are usually focused on themselves.",
    balanced: "I might feel nervous at first, and that's okay. I've handled dinners before and people have been friendly.",
    balancedBelief: 65, share: true,
  });

  const Step = ({ n, title, sub, children }) => (
    <Card className="p-5 md:p-6">
      <div className="flex gap-4">
        <span className="w-8 h-8 rounded-full bg-sagesoft text-sage font-display text-lg grid place-items-center shrink-0">{n}</span>
        <div className="flex-1 min-w-0 flex flex-col gap-4">
          <div><h2 className="font-display text-xl">{title}</h2>{sub && <p className="text-sm text-muted mt-0.5">{sub}</p>}</div>
          {children}
        </div>
      </div>
    </Card>
  );
  const emKeys = Object.keys(f.emotions);

  return (
    <div className="flex flex-col gap-5">
      <div className="flex flex-wrap items-center gap-3">
        <div className="overflow-x-auto -mx-4 px-4 max-w-[calc(100%+2rem)]">
        <div className="inline-flex rounded-full bg-surface2 p-1 whitespace-nowrap" role="tablist">
          {[["new", "Thought record"], ["saved", `Saved records (${logs.length})`], ["selfcare", "Self-care"], ["food", "Food log"], ["meds", "Medications"]].map(([id, l]) => (
            <button key={id} role="tab" aria-selected={tab === id} onClick={() => setTab(id)} className={`rounded-full px-4 py-1.5 text-sm font-semibold transition ${tab === id ? "bg-surface shadow-sm text-ink" : "text-muted"}`}>{l}</button>
          ))}
        </div>
        </div>
        {tab === "new" && <Btn variant="ghost" className="ml-auto" onClick={example}>Fill with an example</Btn>}
      </div>

      {tab === "new" ? (
        <div className="grid lg:grid-cols-3 gap-5 items-start">
          <div className="lg:col-span-2 flex flex-col gap-4">
            {Step({ n: 1, title: "Situation", sub: "Where were you, who was there, what happened?", children:
              <Field htmlFor="tr-situation" label="What happened" error={errors.situation}>
                <textarea id="tr-situation" rows="3" className={inputCls} value={f.situation} onChange={(e) => set("situation", e.target.value)} placeholder="e.g. My manager put a meeting on my calendar with no agenda." />
              </Field> })}
            {Step({ n: 2, title: "Emotions", sub: "Pick what you felt and rate how strong it was, 0–100.", children:
              <div className="flex flex-col gap-4">
                <div className="flex flex-wrap gap-2">
                  {EMOTIONS.map((e) => {
                    const on = !!f.emotions[e];
                    return <button key={e} aria-pressed={on} onClick={() => toggleEmotion(e)} className={`rounded-full px-3.5 py-1.5 text-sm font-semibold border transition ${on ? "bg-primary text-onprimary border-primary" : "border-line hover:bg-surface2"}`}>{e}</button>;
                  })}
                </div>
                {errors.emotions && <p className="text-xs text-danger font-medium">{errors.emotions}</p>}
                {emKeys.map((e) => (
                  <div key={e} className="flex items-center gap-3">
                    <label htmlFor={`em-${e}`} className="w-28 text-sm font-medium">{e}</label>
                    <input id={`em-${e}`} type="range" min="0" max="100" step="5" className="flex-1" value={f.emotions[e].before} onChange={(ev) => setEm(e, "before", +ev.target.value)} />
                    <span className="w-10 text-right text-sm tnum font-semibold">{f.emotions[e].before}</span>
                  </div>
                ))}
              </div> })}
            {Step({ n: 3, title: "Automatic thoughts", sub: "What went through your mind? Write it the way you heard it.", children:
              <div className="flex flex-col gap-4">
                <Field htmlFor="tr-thought" label="Hot thought" error={errors.thought}>
                  <textarea id="tr-thought" rows="2" className={inputCls} value={f.thought} onChange={(e) => set("thought", e.target.value)} placeholder="e.g. I'm going to get fired." />
                </Field>
                <div className="flex items-center gap-3">
                  <label htmlFor="tr-belief" className="text-sm font-medium w-40">How much I believe it</label>
                  <input id="tr-belief" type="range" min="0" max="100" step="5" className="flex-1" value={f.belief} onChange={(e) => set("belief", +e.target.value)} />
                  <span className="w-12 text-right text-sm tnum font-semibold">{f.belief}%</span>
                </div>
              </div> })}
            {Step({ n: 4, title: "Thinking traps", sub: "Check any that fit. There are no wrong answers.", children:
              <div className="grid sm:grid-cols-2 gap-2">
                {DISTORTIONS.map(([d, desc]) => {
                  const on = f.distortions.includes(d);
                  return (
                    <label key={d} htmlFor={`d-${d}`} className={`flex gap-3 rounded-xl border p-3 cursor-pointer transition ${on ? "border-primary bg-primary/5" : "border-line hover:bg-surface2"}`}>
                      <input id={`d-${d}`} type="checkbox" className="mt-1 w-4 h-4" checked={on} onChange={() => toggleD(d)} />
                      <span><span className="text-sm font-semibold block">{d}</span><span className="text-xs text-muted">{desc}</span></span>
                    </label>
                  );
                })}
              </div> })}
            {Step({ n: 5, title: "Balanced perspective", sub: "Look at the evidence, then write a thought that's fair and believable.", children:
              <div className="flex flex-col gap-4">
                <div className="grid sm:grid-cols-2 gap-4">
                  <Field htmlFor="tr-for" label="Evidence for the thought"><textarea id="tr-for" rows="3" className={inputCls} value={f.evFor} onChange={(e) => set("evFor", e.target.value)} /></Field>
                  <Field htmlFor="tr-against" label="Evidence against it"><textarea id="tr-against" rows="3" className={inputCls} value={f.evAgainst} onChange={(e) => set("evAgainst", e.target.value)} /></Field>
                </div>
                <Field htmlFor="tr-balanced" label="A more balanced thought" error={errors.balanced}>
                  <textarea id="tr-balanced" rows="3" className={inputCls} value={f.balanced} onChange={(e) => set("balanced", e.target.value)} placeholder="e.g. It's uncomfortable not knowing, but routine meetings are common. I can ask what it's about." />
                </Field>
                <div className="flex items-center gap-3">
                  <label htmlFor="tr-bb" className="text-sm font-medium w-40">Belief in new thought</label>
                  <input id="tr-bb" type="range" min="0" max="100" step="5" className="flex-1" value={f.balancedBelief} onChange={(e) => set("balancedBelief", +e.target.value)} />
                  <span className="w-12 text-right text-sm tnum font-semibold">{f.balancedBelief}%</span>
                </div>
                {emKeys.length > 0 && (
                  <div className="rounded-xl bg-surface2 p-4 flex flex-col gap-3">
                    <p className="text-sm font-semibold">Re-rate your emotions now</p>
                    {emKeys.map((e) => (
                      <div key={e} className="flex items-center gap-3">
                        <label htmlFor={`after-${e}`} className="w-28 text-sm">{e}</label>
                        <input id={`after-${e}`} type="range" min="0" max="100" step="5" className="flex-1" value={f.emotions[e].after} onChange={(ev) => setEm(e, "after", +ev.target.value)} />
                        <span className="w-20 text-right text-sm tnum"><span className="text-muted">{f.emotions[e].before} →</span> <b>{f.emotions[e].after}</b></span>
                      </div>
                    ))}
                  </div>
                )}
              </div> })}
          </div>
          <div className="lg:sticky lg:top-24 flex flex-col gap-4">
            <Card className="p-5 flex flex-col gap-4">
              <p className="eyebrow text-muted">Summary</p>
              <dl className="text-sm flex flex-col gap-2.5">
                <div className="flex justify-between"><dt className="text-muted">Emotions</dt><dd className="font-semibold tnum">{emKeys.length}</dd></div>
                <div className="flex justify-between"><dt className="text-muted">Thinking traps</dt><dd className="font-semibold tnum">{f.distortions.length}</dd></div>
                <div className="flex justify-between"><dt className="text-muted">Belief shift</dt><dd className="font-semibold tnum">{f.belief}% → {f.balancedBelief}%</dd></div>
              </dl>
              <label htmlFor="tr-share" className="flex items-start gap-3 rounded-xl bg-surface2 p-3 cursor-pointer">
                <input id="tr-share" type="checkbox" className="mt-0.5 w-4 h-4" checked={f.share} onChange={(e) => set("share", e.target.checked)} />
                <span className="text-sm"><b>Add to my session summary</b><span className="block text-xs text-muted">Go over it with {CLIENT.clinician.split(",")[0]} on Tuesday. It's never sent.</span></span>
              </label>
              <Btn onClick={save} className="w-full py-2.5"><Ico name="check" className="w-4 h-4" /> Save log</Btn>
              <Btn variant="soft" onClick={() => { setF(EMPTY); setErrors({}); }} className="w-full">Clear form</Btn>
            </Card>
            <p className="text-xs text-muted px-1 leading-relaxed">Thought records work best soon after a strong feeling. Short notes are fine; bring the rest to session.</p>
          </div>
        </div>
      ) : tab === "saved" ? (
        <SavedLogs logs={logs} setLogs={setLogs} fresh={fresh} say={say} onNew={() => setTab("new")} />
      ) : tab === "selfcare" ? <SelfCare ex={ex} put={put} say={say} />
        : tab === "food" ? <FoodLog ex={ex} put={put} say={say} />
        : <MedLog ex={ex} put={put} say={say} />}
    </div>
  );
}

function SavedLogs({ logs, setLogs, fresh, say, onNew }) {
  const [open, setOpen] = useState(fresh);
  const [confirm, setConfirm] = useState(null);
  if (!logs.length) return <Card className="p-8 text-center"><p className="font-display text-xl">No saved logs yet</p><p className="text-muted text-sm mt-1">Your thought records will appear here.</p><Btn className="mt-4" onClick={onNew}>Start a thought record</Btn></Card>;
  return (
    <div className="flex flex-col gap-3">
      {logs.map((l) => {
        const isOpen = open === l.id;
        return (
          <Card key={l.id} className={`p-5 ${fresh === l.id ? "ring-2 ring-sage/50" : ""}`}>
            <button onClick={() => setOpen(isOpen ? null : l.id)} aria-expanded={isOpen} className="w-full text-left flex flex-col md:flex-row md:items-center gap-3">
              <div className="flex-1 min-w-0">
                <p className="text-xs text-muted tnum">{l.date} {l.share ? "· In session summary" : "· On this device only"}</p>
                <p className="font-semibold mt-0.5">{l.situation}</p>
              </div>
              <div className="flex flex-wrap gap-1.5">
                {Object.entries(l.emotions).map(([e, r]) => (
                  <Pill key={e} className="bg-sagesoft text-sage tnum">{e} {r.before}→{r.after}</Pill>
                ))}
              </div>
              <Ico name="chevron" className={`w-4 h-4 text-muted transition hidden md:block ${isOpen ? "rotate-90" : ""}`} />
            </button>
            {isOpen && (
              <div className="mt-4 pt-4 border-t border-line grid md:grid-cols-2 gap-4 text-sm fade-in">
                <div><p className="eyebrow text-muted mb-1">Automatic thought · {l.belief}%</p><p className="font-display text-lg italic">“{l.thought}”</p></div>
                <div><p className="eyebrow text-muted mb-1">Balanced thought · {l.balancedBelief}%</p><p className="font-display text-lg">{l.balanced}</p></div>
                <div><p className="eyebrow text-muted mb-1">Evidence for</p><p>{l.evFor || "—"}</p></div>
                <div><p className="eyebrow text-muted mb-1">Evidence against</p><p>{l.evAgainst || "—"}</p></div>
                <div className="md:col-span-2 flex flex-wrap gap-1.5">{l.distortions.map((d) => <Pill key={d} className="bg-claysoft text-clay">{d}</Pill>)}</div>
                <div className="md:col-span-2 flex items-center gap-2">
                  {confirm === l.id ? (
                    <>
                      <span className="text-sm">Delete this log permanently?</span>
                      <Btn variant="danger" onClick={() => { setLogs(logs.filter((x) => x.id !== l.id)); setConfirm(null); say("Log deleted"); }}>Delete</Btn>
                      <Btn variant="soft" onClick={() => setConfirm(null)}>Keep</Btn>
                    </>
                  ) : <>
                    <Btn variant="soft" onClick={() => { setLogs(logs.map((x) => (x.id === l.id ? { ...x, share: !x.share } : x))); say(l.share ? "Removed from your session summary" : "Added to your session summary", l.share ? undefined : "small"); }}><Ico name="notebook" className="w-4 h-4" /> {l.share ? "Remove from session summary" : "Add to session summary"}</Btn>
                    <Btn variant="ghost" onClick={() => setConfirm(l.id)}><Ico name="trash" className="w-4 h-4" /> Delete</Btn>
                  </>}
                </div>
              </div>
            )}
          </Card>
        );
      })}
    </div>
  );
}

/* ---------- Resources ---------- */

function VideoTracker({ watched, setWatched, say }) {
  const [cur, setCur] = useState(watched.findIndex((w) => !w) === -1 ? 0 : watched.findIndex((w) => !w));
  const [pos, setPos] = useState(0);
  const [playing, setPlaying] = useState(false);
  const len = VIDEO_MODULES[cur].len;
  useEffect(() => {
    if (!playing) return;
    const t = setInterval(() => setPos((x) => Math.min(x + 6, len)), 200);
    return () => clearInterval(t);
  }, [playing, len]);
  useEffect(() => {
    if (pos >= len && playing) {
      setPlaying(false);
      if (!watched[cur]) { setWatched(watched.map((w, i) => (i === cur ? true : w))); say(watched.filter(Boolean).length === 4 ? "You finished the whole video series!" : `Module ${cur + 1} complete`, watched.filter(Boolean).length === 4 ? "big" : "small"); }
    }
  }, [pos]);
  const pick = (i) => { setCur(i); setPos(0); setPlaying(false); };
  const done = watched.filter(Boolean).length;
  return (
    <div className="grid lg:grid-cols-5 gap-5 items-start">
      <Card className="lg:col-span-3 overflow-hidden">
        <div className="aspect-video bg-primary text-onprimary relative grid place-items-center">
          <div className="absolute inset-0 opacity-20" style={{ background: "radial-gradient(circle at 30% 40%, rgb(var(--sage)), transparent 55%)" }} />
          <div className="relative text-center px-6">
            <p className="eyebrow opacity-70">Module {cur + 1} of 5</p>
            <p className="font-display text-2xl md:text-3xl mt-2">{VIDEO_MODULES[cur].t}</p>
            <button onClick={() => { if (pos >= len) setPos(0); setPlaying(!playing); }} aria-label={playing ? "Pause" : "Play"} className="mt-5 w-14 h-14 rounded-full bg-onprimary text-primary grid place-items-center mx-auto hover:scale-105 transition">
              <Ico name={playing ? "pause" : "play"} className="w-6 h-6" />
            </button>
          </div>
        </div>
        <div className="p-4 flex items-center gap-3">
          <span className="text-xs tnum text-muted w-10">{mmss(pos)}</span>
          <input type="range" min="0" max={len} value={pos} onChange={(e) => setPos(+e.target.value)} className="flex-1" aria-label="Seek" />
          <span className="text-xs tnum text-muted w-10 text-right">{mmss(len)}</span>
        </div>
        <p className="px-4 pb-4 text-xs text-muted">Prototype player: playback runs at 30× speed so you can see the tracker update.</p>
      </Card>
      <Card className="lg:col-span-2 p-5 flex flex-col gap-3">
        <div className="flex items-baseline justify-between"><p className="eyebrow text-muted">Your progress</p><span className="text-sm font-semibold tnum">{done}/5</span></div>
        <div className="h-2 rounded-full bg-surface2 overflow-hidden"><div className="h-full bg-sage transition-all" style={{ width: `${done * 20}%` }} /></div>
        <ol className="flex flex-col gap-1 mt-1">
          {VIDEO_MODULES.map((m, i) => (
            <li key={m.t} className={`flex items-center gap-3 rounded-xl px-2.5 py-2 ${cur === i ? "bg-surface2" : ""}`}>
              <input type="checkbox" id={`vm-${i}`} className="w-4 h-4" checked={watched[i]} onChange={() => setWatched(watched.map((w, j) => (j === i ? !w : w)))} aria-label={`Mark module ${i + 1} watched`} />
              <button onClick={() => pick(i)} className="flex-1 text-left text-sm">
                <span className={`font-medium ${watched[i] ? "text-muted" : ""}`}>{i + 1}. {m.t}</span>
                <span className="block text-xs text-muted tnum">{Math.round(m.len / 60)} min</span>
              </button>
            </li>
          ))}
        </ol>
      </Card>
    </div>
  );
}

function CouplesLog({ couples, setCouples, say }) {
  const STEPS = ["Soft start-up", "Took turns as speaker / listener", "Reflected before responding", "Took a 20-min break when flooded", "Made a repair attempt"];
  const blank = { topic: "", starter: "Me", steps: [], flood: 5, helped: "", shared: true };
  const [f, setF] = useState(blank);
  const [err, setErr] = useState("");
  const save = () => {
    if (!f.topic.trim()) { setErr("Add a few words about the topic."); return; }
    setCouples([{ ...f, id: Date.now(), date: nowStamp() }, ...couples]); setF(blank); setErr(""); say(f.shared ? "Saved and added to your session summary" : "Saved on this device", "small");
  };
  return (
    <div className="grid lg:grid-cols-5 gap-5 items-start">
      <Card className="lg:col-span-3 p-5 md:p-6 flex flex-col gap-4">
        <p className="eyebrow text-muted">Log a disagreement</p>
        <Field htmlFor="c-topic" label="What was it about?" error={err}>
          <input id="c-topic" className={inputCls} value={f.topic} onChange={(e) => setF({ ...f, topic: e.target.value })} placeholder="e.g. Splitting chores during a busy week" />
        </Field>
        <div className="flex flex-col gap-1.5">
          <p className="text-sm font-semibold">Who raised it?</p>
          <div className="inline-flex rounded-full bg-surface2 p-1 self-start">
            {["Me", "Partner"].map((s) => <button key={s} onClick={() => setF({ ...f, starter: s })} className={`rounded-full px-4 py-1.5 text-sm font-semibold ${f.starter === s ? "bg-surface shadow-sm" : "text-muted"}`}>{s}</button>)}
          </div>
        </div>
        <div className="flex flex-col gap-2">
          <p className="text-sm font-semibold">What did you use?</p>
          {STEPS.map((s) => (
            <label key={s} htmlFor={`cs-${s}`} className="flex items-center gap-3 text-sm cursor-pointer">
              <input id={`cs-${s}`} type="checkbox" className="w-4 h-4" checked={f.steps.includes(s)} onChange={() => setF({ ...f, steps: f.steps.includes(s) ? f.steps.filter((x) => x !== s) : [...f.steps, s] })} />{s}
            </label>
          ))}
        </div>
        <div className="flex items-center gap-3">
          <label htmlFor="c-flood" className="text-sm font-semibold w-40">Peak flooding (1–10)</label>
          <input id="c-flood" type="range" min="1" max="10" className="flex-1" value={f.flood} onChange={(e) => setF({ ...f, flood: +e.target.value })} />
          <span className="w-6 text-right tnum font-semibold">{f.flood}</span>
        </div>
        <Field htmlFor="c-helped" label="What helped you find each other again?">
          <textarea id="c-helped" rows="2" className={inputCls} value={f.helped} onChange={(e) => setF({ ...f, helped: e.target.value })} />
        </Field>
        <div className="flex flex-wrap items-center gap-3 justify-between">
          <label htmlFor="c-share" className="flex items-center gap-2 text-sm cursor-pointer"><input id="c-share" type="checkbox" className="w-4 h-4" checked={f.shared} onChange={(e) => setF({ ...f, shared: e.target.checked })} /> Bring to our next session</label>
          <Btn onClick={save}>Save entry</Btn>
        </div>
      </Card>
      <div className="lg:col-span-2 flex flex-col gap-3">
        <p className="eyebrow text-muted">Recent entries</p>
        {couples.map((c) => (
          <Card key={c.id} className="p-4 flex flex-col gap-2 fade-in">
            <div className="flex justify-between gap-2 text-xs text-muted tnum"><span>{c.date}</span><span className="flex items-center gap-1">{c.shared ? <><Ico name="notebook" className="w-3.5 h-3.5" />In session summary</> : <><Ico name="lock" className="w-3.5 h-3.5" />On this device</>}</span></div>
            <p className="font-semibold">{c.topic}</p>
            <p className="text-xs text-muted">Raised by {c.starter === "Me" ? "you" : "your partner"} · Flooding {c.flood}/10</p>
            {c.steps.length > 0 && <div className="flex flex-wrap gap-1.5">{c.steps.map((s) => <Pill key={s} className="bg-claysoft text-clay">{s}</Pill>)}</div>}
            {c.helped && <p className="text-sm italic">“{c.helped}”</p>}
          </Card>
        ))}
        <p className="text-xs text-muted leading-relaxed">Entries are saved only on this device. Look at them together, or bring them to your couples session.</p>
      </div>
    </div>
  );
}

function Grounding({ groundingCount, setGroundingCount, say }) {
  const STEPS = [
    { n: 5, sense: "see", prompt: "Look around and name five things you can see." },
    { n: 4, sense: "feel", prompt: "Notice four things you can physically feel, like your feet on the floor." },
    { n: 3, sense: "hear", prompt: "Listen for three things you can hear." },
    { n: 2, sense: "smell", prompt: "Find two things you can smell, or two scents you like." },
    { n: 1, sense: "taste", prompt: "Notice one thing you can taste." },
  ];
  const [i, setI] = useState(-1);
  const [ans, setAns] = useState(STEPS.map((s) => Array(s.n).fill("")));
  const [before, setBefore] = useState(6);
  const [after, setAfter] = useState(3);
  const [audioMsg, setAudioMsg] = useState("");
  const speak = (text) => {
    try {
      if (!("speechSynthesis" in window)) throw 0;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.rate = 0.85; window.speechSynthesis.speak(u);
      setAudioMsg("Playing prompt…");
    } catch { setAudioMsg("Audio isn't available on this device. Follow the written prompt."); }
  };
  useEffect(() => () => { try { window.speechSynthesis.cancel(); } catch {} }, []);
  const finish = () => { setGroundingCount(groundingCount + 1); setI(5); say("Grounding practice logged", "big"); };
  const reset = () => { setI(-1); setAns(STEPS.map((s) => Array(s.n).fill(""))); setAudioMsg(""); };
  return (
    <div className="grid lg:grid-cols-3 gap-5 items-start">
      <Card className="lg:col-span-2 p-5 md:p-7 flex flex-col gap-5 min-h-[360px]">
        {i === -1 && (
          <div className="flex flex-col gap-5">
            <p className="font-display text-2xl">Before you start</p>
            <div className="flex flex-col gap-2">
              <label htmlFor="g-before" className="text-sm font-semibold">Distress right now (SUDS 0–10)</label>
              <div className="flex items-center gap-3"><input id="g-before" type="range" min="0" max="10" className="flex-1" value={before} onChange={(e) => setBefore(+e.target.value)} /><span className="font-display text-2xl tnum w-8 text-right">{before}</span></div>
            </div>
            <p className="text-sm text-muted">Find a comfortable position. Each step has a spoken prompt you can play, and space to jot what you notice.</p>
            <Btn className="self-start" onClick={() => { setI(0); speak(STEPS[0].prompt); }}><Ico name="play" className="w-4 h-4" /> Begin guided exercise</Btn>
          </div>
        )}
        {i >= 0 && i < 5 && (
          <div key={i} className="flex flex-col gap-5 fade-in">
            <div className="flex items-center gap-4">
              <span className="font-display text-6xl text-sage leading-none tnum">{STEPS[i].n}</span>
              <div><p className="eyebrow text-muted">Things you can {STEPS[i].sense}</p><p className="font-display text-xl mt-1">{STEPS[i].prompt}</p></div>
            </div>
            <div className="flex items-center gap-3">
              <Btn variant="soft" onClick={() => speak(STEPS[i].prompt)}><Ico name="sound" className="w-4 h-4" /> Play prompt</Btn>
              {audioMsg && <span className="text-xs text-muted">{audioMsg}</span>}
            </div>
            <div className="grid sm:grid-cols-2 gap-2">
              {ans[i].map((v, k) => (
                <input key={k} id={`g-${i}-${k}`} className={inputCls} placeholder={`${k + 1}.`} value={v} onChange={(e) => setAns(ans.map((row, r) => r === i ? row.map((x, c) => c === k ? e.target.value : x) : row))} />
              ))}
            </div>
            <div className="flex gap-2 mt-auto">
              {i > 0 && <Btn variant="soft" onClick={() => setI(i - 1)}>Back</Btn>}
              <Btn onClick={() => { if (i < 4) { setI(i + 1); speak(STEPS[i + 1].prompt); } else { try { window.speechSynthesis.cancel(); } catch {} setI(4.5); } }}>{i < 4 ? "Next sense" : "Finish"}</Btn>
            </div>
          </div>
        )}
        {i === 4.5 && (
          <div className="flex flex-col gap-5 fade-in">
            <p className="font-display text-2xl">How do you feel now?</p>
            <div className="flex items-center gap-3"><label htmlFor="g-after" className="sr-only">Distress after</label><input id="g-after" type="range" min="0" max="10" className="flex-1" value={after} onChange={(e) => setAfter(+e.target.value)} /><span className="font-display text-2xl tnum w-8 text-right">{after}</span></div>
            <Btn className="self-start" onClick={finish}>Log practice</Btn>
          </div>
        )}
        {i === 5 && (
          <div className="flex flex-col gap-4 fade-in">
            <span className="w-12 h-12 rounded-full bg-sagesoft text-sage grid place-items-center"><Ico name="leaf" /></span>
            <p className="font-display text-2xl">Distress went from {before} to {after}.</p>
            <p className="text-muted">Nice work staying with it. If distress stays high, use your container exercise and reach out to your clinician.</p>
            <Btn variant="soft" className="self-start" onClick={reset}>Practice again</Btn>
          </div>
        )}
      </Card>
      <div className="flex flex-col gap-4">
        <Card className="p-5">
          <p className="eyebrow text-muted">Steps</p>
          <ol className="flex flex-col gap-2 mt-3">
            {STEPS.map((s, k) => (

function Breath({ breathCount, setBreathCount, breathPace, setBreathPace, say }) {
  const PACES = [
    { s: 5, label: "Gentle", note: "6 breaths/min · good starting point" },
    { s: 7, label: "Moderate", note: "about 4 breaths/min" },
    { s: 10, label: "Deep", note: "3 breaths/min · for practiced clients" },
  ];
  const [on, setOn] = useState(false);
  const [phase, setPhase] = useState("in");
  const [n, setN] = useState(0);
  useEffect(() => {
    if (!on) return;
    const t = setInterval(() => {
      setPhase((ph) => {
        if (ph === "out") setN((x) => x + 1);
        return ph === "in" ? "out" : "in";
      });
    }, breathPace * 1000);
    return () => clearInterval(t);
  }, [on, breathPace]);
  const total = breathPace * 2 * 6;
  const dur = total >= 90 ? `about ${Math.round(total / 60)} minutes` : total >= 60 ? "about 1 minute" : `about ${total} seconds`;
  useEffect(() => { if (n >= 6 && on) { setOn(false); setBreathCount(breathCount + 1); say("Breathing session complete", "big"); } }, [n]);
  const start = () => { setN(0); setPhase("in"); setOn(true); };
  return (
    <div className="grid lg:grid-cols-3 gap-5 items-start">
      <Card className="lg:col-span-2 p-6 md:p-10 flex flex-col items-center gap-6 text-center">
        <div className="relative w-56 h-56 grid place-items-center">
          <div className="absolute inset-0 rounded-full bg-sagesoft" />
          <div className="breath absolute rounded-full bg-sage/70" style={{ width: "100%", height: "100%", transitionDuration: `${breathPace}s`, transform: `scale(${on ? (phase === "in" ? 0.95 : 0.45) : 0.45})` }} />
          <span className="relative font-display text-2xl text-ink">{on ? (phase === "in" ? "Breathe in" : "Breathe out") : "Ready"}</span>
        </div>
        <p className="text-sm text-muted tnum">{on ? `Breath ${Math.min(n + 1, 6)} of 6 · ${breathPace} s in, ${breathPace} s out` : `Six slow breaths at ${breathPace} s in, ${breathPace} s out, ${dur}.`}</p>
        {on ? <Btn variant="soft" onClick={() => setOn(false)}><Ico name="pause" className="w-4 h-4" /> Stop</Btn> : <Btn onClick={start}><Ico name="play" className="w-4 h-4" /> Start</Btn>}
        <p className="text-xs text-muted">Sessions today: <b className="tnum">{breathCount}</b></p>
      </Card>
      <div className="flex flex-col gap-4">
        <Card className="p-5 flex flex-col gap-3">
          <div>
            <p className="eyebrow text-muted">Breathing pace</p>
            <p className="text-sm mt-1">Set by <b>{CLIENT.clinician}</b> for {CLIENT.first}</p>
          </div>
          <div className="flex flex-col gap-2" role="radiogroup" aria-label="Breathing pace">
            {PACES.map((p) => {
              const sel = breathPace === p.s;
              return (
                <button key={p.s} role="radio" aria-checked={sel} disabled={on} onClick={() => { setBreathPace(p.s); say(`Pace set to ${p.s} seconds`); }}
                  className={`flex items-center gap-3 rounded-xl border p-3 text-left transition disabled:opacity-50 disabled:cursor-not-allowed ${sel ? "border-primary bg-primary/5" : "border-line hover:bg-surface2"}`}>
                  <span className={`w-4 h-4 rounded-full border-2 grid place-items-center shrink-0 ${sel ? "border-primary" : "border-line"}`}>{sel && <span className="w-2 h-2 rounded-full bg-primary" />}</span>
                  <span className="flex-1"><span className="text-sm font-semibold tnum">{p.s} s in · {p.s} s out</span><span className="block text-xs text-muted">{p.label} · {p.note}</span></span>
                </button>
              );
            })}
          </div>
          {on && <p className="text-xs text-muted">Stop the session to change the pace.</p>}
        </Card>
        <p className="text-xs text-muted leading-relaxed px-1">Prototype: in the live app, clinicians set this from their portal and clients see it as their assigned pace. If a pace feels like a strain, stop and let your clinician know.</p>
      </div>
    </div>
  );
}

          <div key={d} className="flex flex-col gap-2">
            <p className="eyebrow text-muted">{d}</p>
            {ex.activation.filter((a) => a.day === d).map((a) => (
              <Card key={a.id} className="p-4 flex flex-col gap-3">
                <div className="flex items-center gap-3">
                  <input type="checkbox" id={`ba-${a.id}`} className="w-5 h-5" checked={a.done} onChange={() => { if (a.done) upd(put, "activation", a.id, { done: false }); else setRate(a.id); }} aria-label={`Mark ${a.text} done`} />
                  <label htmlFor={`ba-${a.id}`} className={`flex-1 font-medium ${a.done ? "text-muted line-through decoration-line" : ""}`}>{a.text}</label>
                  <Pill className={a.cat === "Mastery" ? "bg-primary/10 text-primary" : a.cat === "Connection" ? "bg-claysoft text-clay" : "bg-sagesoft text-sage"}>{a.cat}</Pill>
                  {a.done && <span className="text-xs text-muted tnum">P {a.p} · M {a.m}</span>}
                </div>
                {rate === a.id && (
                  <div className="rounded-xl bg-surface2 p-4 flex flex-col gap-3 fade-in">
                    <p className="text-sm font-semibold">Nice. How was it?</p>
                    <Slider id={`p-${a.id}`} label="Pleasure (0–10)" value={a.p} onChange={(v) => upd(put, "activation", a.id, { p: v })} />
                    <Slider id={`m-${a.id}`} label="Mastery (0–10)" value={a.m} onChange={(v) => upd(put, "activation", a.id, { m: v })} />
                    <Btn className="self-start" onClick={() => { upd(put, "activation", a.id, { done: true }); setRate(null); say("Activity completed", "small"); }}>Mark done</Btn>
                  </div>
                )}
              </Card>
            ))}
          </div>
        ))}
      </div>
      <div className="flex flex-col gap-4">
        <Card className="p-5 flex flex-col gap-3">
          <p className="eyebrow text-muted">This week</p>
          <div className="grid grid-cols-3 gap-2 text-center">
            {[["Done", `${done.length}/${ex.activation.length}`], ["Avg pleasure", avg("p")], ["Avg mastery", avg("m")]].map(([l, v]) => (
              <div key={l} className="rounded-xl bg-surface2 py-3"><p className="font-display text-2xl tnum">{v}</p><p className="text-[11px] text-muted">{l}</p></div>
            ))}
          </div>
          {best && <p className="text-sm">Most enjoyable so far: <b>{best.text}</b></p>}
        </Card>
        <Note title="Action before motivation" tone="sage">When mood is low, waiting to feel like it keeps you stuck. Small planned actions tend to lift mood first.</Note>
      </div>
    </div>
  );
}

/* CBT: Behavioral experiment */
function Experiment({ ex, put, say }) {
  const blank = { belief: "", before: 70, prediction: "", plan: "" };
  const [f, setF] = useState(blank); const [err, setErr] = useState("");
  const create = () => {
    if (!f.belief.trim() || !f.prediction.trim()) { setErr("Add the belief and what you predict will happen."); return; }
    put("experiments", (l) => [{ id: Date.now(), ...f, outcome: "", learned: "", after: f.before, status: "planned" }, ...l]); setF(blank); setErr(""); say("Experiment planned", "small");
  };
  return (
    <div className="grid lg:grid-cols-5 gap-5 items-start">
      <Card className="lg:col-span-2 p-5 flex flex-col gap-3">
        <p className="eyebrow text-muted">Plan a new experiment</p>
        <Field htmlFor="be-b" label="Belief to test" error={err}><textarea id="be-b" rows="2" className={inputCls} value={f.belief} onChange={(e) => setF({ ...f, belief: e.target.value })} placeholder="e.g. If I say no, my friend will be angry." /></Field>
        <Slider id="be-bb" label="How true it feels" value={f.before} onChange={(v) => setF({ ...f, before: v })} max={100} suffix="%" />
        <Field htmlFor="be-p" label="What I predict will happen"><textarea id="be-p" rows="2" className={inputCls} value={f.prediction} onChange={(e) => setF({ ...f, prediction: e.target.value })} /></Field>
        <Field htmlFor="be-plan" label="The experiment (what, when, where)"><textarea id="be-plan" rows="2" className={inputCls} value={f.plan} onChange={(e) => setF({ ...f, plan: e.target.value })} /></Field>
        <Btn className="self-start" onClick={create}>Plan experiment</Btn>
      </Card>
      <div className="lg:col-span-3 flex flex-col gap-3">
        {ex.experiments.map((e) => (
          <Card key={e.id} className="p-5 flex flex-col gap-3">
            <div className="flex items-center gap-2">
              {["Plan", "Do", "Review"].map((s, i) => {
                const reached = e.status === "done" ? 3 : 1;
                return <React.Fragment key={s}><span className={`text-xs font-semibold rounded-full px-2.5 py-0.5 ${i < reached ? "bg-sage text-white" : i === reached ? "bg-primary text-onprimary" : "bg-surface2 text-muted"}`}>{s}</span>{i < 2 && <span className="w-4 h-px bg-line" />}</React.Fragment>;
              })}
            </div>
            <p className="font-display text-lg leading-snug">“{e.belief}”</p>
            <dl className="grid sm:grid-cols-2 gap-3 text-sm">
              <div><dt className="eyebrow text-muted">Prediction</dt><dd className="mt-0.5">{e.prediction}</dd></div>
              <div><dt className="eyebrow text-muted">Experiment</dt><dd className="mt-0.5">{e.plan || "—"}</dd></div>
            </dl>
            {e.status === "planned" ? (
              <div className="rounded-xl bg-surface2 p-4 flex flex-col gap-3">
                <Field htmlFor={`be-o-${e.id}`} label="What actually happened?"><textarea id={`be-o-${e.id}`} rows="2" className={inputCls} value={e.outcome} onChange={(v) => upd(put, "experiments", e.id, { outcome: v.target.value })} /></Field>
                <Field htmlFor={`be-l-${e.id}`} label="What I learned"><textarea id={`be-l-${e.id}`} rows="2" className={inputCls} value={e.learned} onChange={(v) => upd(put, "experiments", e.id, { learned: v.target.value })} /></Field>
                <Slider id={`be-a-${e.id}`} label="How true it feels now" value={e.after} onChange={(v) => upd(put, "experiments", e.id, { after: v })} max={100} suffix="%" />
                <Btn className="self-start" disabled={!e.outcome.trim()} onClick={() => { upd(put, "experiments", e.id, { status: "done" }); say("Experiment reviewed", "big"); }}>Complete review</Btn>
              </div>
            ) : (
              <div className="grid sm:grid-cols-2 gap-3 text-sm border-t border-line pt-3">
                <div><p className="eyebrow text-muted">What happened</p><p className="mt-0.5">{e.outcome}</p></div>
                <div><p className="eyebrow text-muted">Learned</p><p className="mt-0.5">{e.learned || "—"}</p></div>
                <p className="sm:col-span-2 font-semibold tnum">Belief: {e.before}% → {e.after}%</p>
              </div>
            )}
          </Card>
        ))}
      </div>
    </div>
  );
}

/* CBT: Downward arrow */
function Downward({ ex, put, say, logs }) {
  const CORE = ["I'm unlovable", "I'm not good enough", "I'm a failure", "I'm helpless", "I'm worthless", "I'm not safe", "I'm a burden"];
  const start = logs && logs[0] ? logs[0].thought : "";
  const [levels, setLevels] = useState([start, ""]);
  const [core, setCore] = useState(""); const [strength, setStrength] = useState(70); const [alt, setAlt] = useState("");
  const setL = (i, v) => setLevels(levels.map((x, j) => (j === i ? v : x)));
  const save = () => {
    const chain = levels.filter((l) => l.trim());
    if (chain.length < 2 || !core) { say("Add at least two levels and pick a core belief"); return; }
    put("chains", (l) => [{ id: Date.now(), date: today(), chain, core, strength, alt }, ...l]);
    setLevels(["", ""]); setCore(""); setAlt(""); say("Saved for your next session", "gentle");
  };
  return (
    <div className="grid lg:grid-cols-5 gap-5 items-start">
      <Card className="lg:col-span-3 p-5 md:p-6 flex flex-col gap-2">
        {levels.map((l, i) => (
          <div key={i} className="flex flex-col gap-2">
            {i > 0 && <div className="flex items-center gap-2 text-sm text-muted pl-2"><Ico name="arrowdown" className="w-4 h-4 text-sage" /><span className="italic">If that were true, what would it mean about me?</span></div>}
            <input id={`dw-${i}`} className={inputCls} value={l} onChange={(e) => setL(i, e.target.value)} placeholder={i === 0 ? "Start with a hot thought" : "It would mean…"} />
          </div>
        ))}
        <Btn variant="ghost" className="self-start mt-1" disabled={!levels[levels.length - 1].trim() || levels.length >= 6} onClick={() => setLevels([...levels, ""])}><Ico name="arrowdown" className="w-4 h-4" /> Go one level deeper</Btn>
        <div className="border-t border-line mt-3 pt-4 flex flex-col gap-3">
          <p className="text-sm font-semibold">Which core belief does this point to?</p>
          <Chips options={CORE} value={core} onChange={setCore} tone="clay" />
          <input id="dw-core" className={inputCls} value={CORE.includes(core) ? "" : core} onChange={(e) => setCore(e.target.value)} placeholder="Or write it in your own words" />
          <Slider id="dw-s" label="How true it feels" value={strength} onChange={setStrength} max={100} suffix="%" />
          <Field htmlFor="dw-alt" label="A kinder, more accurate belief to practice"><input id="dw-alt" className={inputCls} value={alt} onChange={(e) => setAlt(e.target.value)} placeholder="e.g. I'm capable, and I can make mistakes and still be okay." /></Field>
          <Btn className="self-start" onClick={save}>Save chain</Btn>
        </div>
      </Card>
      <div className="lg:col-span-2 flex flex-col gap-3">
        <Note title="Go gently">Core beliefs can stir up strong feelings. Stop whenever you need to and bring what you found to session.</Note>
        {ex.chains.length === 0 ? <Empty>Saved chains appear here.</Empty> : ex.chains.map((c) => (
          <Card key={c.id} className="p-4 flex flex-col gap-2 fade-in">
            <p className="text-xs text-muted">{c.date}</p>
            <ol className="text-sm flex flex-col gap-1">{c.chain.map((x, i) => <li key={i} className="flex gap-2"><span className="text-sage">{i ? "↓" : "•"}</span>{x}</li>)}</ol>
            <p className="font-display text-lg">{c.core} <span className="text-sm text-muted tnum">· {c.strength}%</span></p>
            {c.alt && <p className="text-sm text-sage font-semibold">Practicing: {c.alt}</p>}
          </Card>
        ))}
      </div>
    </div>
  );
}

/* EFT: Under the surface */
function Surface({ ex, put, say }) {
  const TOP = ["Anger", "Frustration", "Numbness", "Criticism", "Defensiveness"];
  const UNDER = ["Fear", "Hurt", "Loneliness", "Shame", "Sadness", "Rejection"];
  const NEED = ["To feel I matter", "Reassurance", "Closeness", "To be accepted", "To feel safe", "To be heard"];
  const [f, setF] = useState({ sit: "", top: "Frustration", under: ["Hurt"], need: "To be heard", shared: true });
  const msg = (x) => `When ${x.sit.trim() || "…"}, I show ${x.top.toLowerCase()}, but underneath I feel ${x.under.length ? x.under.join(" and ").toLowerCase() : "…"}. What I need is ${x.need.charAt(0).toLowerCase() + x.need.slice(1)}.`;
  const copy = async () => { try { await navigator.clipboard.writeText(msg(f)); say("Copied"); } catch { say("Select the text to copy it"); } };
  const save = () => { if (!f.sit.trim()) { say("Describe what happened first"); return; } put("surface", (l) => [{ id: Date.now(), date: today(), ...f }, ...l]); setF({ ...f, sit: "" }); say(f.shared ? "Saved and added to your session summary" : "Saved on this device", "small"); };
  return (
    <div className="grid lg:grid-cols-5 gap-5 items-start">
      <Card className="lg:col-span-3 p-5 md:p-6 flex flex-col gap-4">

        <div className="flex flex-col gap-2"><p className="text-sm font-semibold">Above the waterline, I showed…</p><Chips options={TOP} value={f.top} onChange={(v) => setF({ ...f, top: v })} tone="clay" /></div>
        <div className="flex flex-col gap-2"><p className="text-sm font-semibold">Underneath, I felt…</p><Chips multi options={UNDER} value={f.under} onChange={(v) => setF({ ...f, under: v })} /></div>
        <div className="flex flex-col gap-2"><p className="text-sm font-semibold">What I needed</p><Chips options={NEED} value={f.need} onChange={(v) => setF({ ...f, need: v })} tone="sage" /></div>
        <label htmlFor="su-share" className="flex items-center gap-2 text-sm cursor-pointer"><input id="su-share" type="checkbox" className="w-4 h-4" checked={f.shared} onChange={(e) => setF({ ...f, shared: e.target.checked })} /> Bring to our next session</label>
        <div className="flex gap-2"><Btn onClick={save}>Save message</Btn><Btn variant="soft" onClick={copy}>Copy text</Btn></div>
      </Card>
      <div className="lg:col-span-2 flex flex-col gap-4">
        <div className="rounded-2xl overflow-hidden border border-line">
          <div className="bg-surface px-5 pt-5 pb-3 text-center"><p className="eyebrow text-muted">Surface</p><p className="font-display text-2xl text-clay mt-1">{f.top}</p></div>
          <div className="h-1 bg-primary/40" />
          <div className="bg-primary/10 px-5 py-6 text-center flex flex-col gap-2">

        </div>
        <Note tone="sage"><p className="select-all italic">“{msg(f)}”</p></Note>
        {ex.surface.map((s) => (
          <Card key={s.id} className="p-4 text-sm fade-in"><p className="text-xs text-muted mb-1">{s.date} · {s.shared ? "In session summary" : "On this device"}</p><p className="italic">“{msg(s)}”</p></Card>
        ))}
      </div>
    </div>
  );
}

/* EFT: Connection conversations */
const HMT = [
  ["Recognizing our pattern", ["What do we each do when we start to feel disconnected?", "What name could we give this pattern?", "How does it leave each of us feeling?"]],
  ["Finding our sore spots", ["Which moments sting the most for me in our relationship?", "Where might that sensitivity come from?", "How can you tell when I've been hit in a sore spot?"]],
  ["Revisiting a rough moment", ["Pick a recent small argument. What did each of us do?", "What was I feeling underneath?", "What could we each do differently next time?"]],
  ["Reaching and responding", ["What do I most need from you when I'm hurting?", "What makes it hard for me to ask for it?", "How can I tell you're there for me?"]],
  ["Healing an old hurt", ["Is there a hurt between us that still feels unresolved?", "What would help me feel you understand its impact?", "What would repair look like for us?"]],
  ["Closeness and touch", ["When do I feel closest to you physically?", "What helps me feel safe and relaxed with touch?", "What would we like more of?"]],
  ["Keeping our connection alive", ["What rituals help us stay close?", "What story do we want to tell about how we got through this?", "What do we want the next year to look like?"]],
];
function HoldTight({ ex, put, say }) {
  const h = ex.hmt;
  const [open, setOpen] = useState(h.current);
  const [draft, setDraft] = useState("");
  return (
    <div className="grid lg:grid-cols-3 gap-5 items-start">
      <div className="lg:col-span-2 flex flex-col gap-2">
        {HMT.map(([t, qs], i) => {
          const locked = i > h.current, done = i < h.current || (i === h.current && h.done), isOpen = open === i && !locked;
          return (
            <Card key={t} className={`p-4 ${locked ? "opacity-60" : ""}`}>
              <button disabled={locked} onClick={() => setOpen(isOpen ? null : i)} aria-expanded={isOpen} className="w-full flex items-center gap-3 text-left disabled:cursor-not-allowed">

                    <div className="flex flex-col gap-2">
                      <input id={`hmt-${i}`} className={inputCls} value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="A note on how it went (optional)" />
                      <Btn className="self-start" onClick={() => { put("hmt", { current: h.current, notes: { ...h.notes, [i]: draft || "Talked it through." }, done: true }); setDraft(""); say("Marked as talked through. Your therapist unlocks the next one.", "big"); }}>We had this conversation</Btn>
                    </div>
                  )}
                </div>
              )}
            </Card>
          );
        })}
      </div>
      <div className="flex flex-col gap-4">
        <Note title="How to use these">Set aside 20 minutes when you're both calm. Take turns answering. If it starts to escalate, pause and bring it to session.</Note>

        <Btn variant="soft" className="self-start" onClick={() => { if (h.current < 6) { put("hmt", { ...h, current: h.current + 1, done: false }); setOpen(h.current + 1); say("Demo: next conversation unlocked"); } }}>Demo: unlock next as therapist</Btn>
      </div>
    </div>
  );
}

/* Imago: Dialogue guide */
function Dialogue({ ex, put, say }) {
  const STAGES = [
    { k: "Send", who: "sender", stems: ["I'd like to talk about…", "When ___ happened, I felt…"], tip: "Keep it to a few sentences and speak about yourself." },
    { k: "Mirror", who: "receiver", stems: ["What I hear you saying is…", "Did I get that?"], tip: "Reflect back without adding your own interpretation." },
    { k: "Is there more?", who: "receiver", stems: ["Is there more about that?"], tip: "Stay curious. There usually is more." },
    { k: "Summarize", who: "receiver", stems: ["Let me see if I got all of it…", "Did I get it all?"], tip: "Pull the main points together." },
    { k: "Validate", who: "receiver", stems: ["You make sense, because…"], tip: "Validating isn't agreeing. It shows the logic of your partner's experience." },
    { k: "Empathize", who: "receiver", stems: ["I imagine you might be feeling…", "Is that what you feel?"], tip: "Guess at the feeling, then check it." },
  ];
  const [topic, setTopic] = useState(""); const [sender, setSender] = useState("You");
  const [i, setI] = useState(-1); const [mores, setMores] = useState(0);
  const st = STAGES[i];
  const receiver = sender === "You" ? PARTNER : "You";
  const speaker = st && (st.who === "sender" ? sender : receiver);
  const finish = (swap) => {
    put("dialogues", (l) => [{ id: Date.now(), date: today(), topic, sender, mores }, ...l]); say("Dialogue logged", "big");
    if (swap) { setSender(receiver); setI(0); setMores(0); } else { setI(-1); setTopic(""); setMores(0); }
  };
  return (
    <div className="grid lg:grid-cols-3 gap-5 items-start">
      <Card className="lg:col-span-2 p-5 md:p-7 flex flex-col gap-5 min-h-[340px]">
        {i === -1 && (
          <div className="flex flex-col gap-4">
            <Field htmlFor="dl-topic" label="What do you want to talk about?"><input id="dl-topic" className={inputCls} value={topic} onChange={(e) => setTopic(e.target.value)} placeholder="Keep it to one topic" /></Field>
            <div className="flex flex-col gap-2"><p className="text-sm font-semibold">Who sends first?</p><Chips options={["You", PARTNER]} value={sender} onChange={setSender} /></div>
            <p className="text-sm text-muted">The sender asks, “Is now a good time for a dialogue?” The receiver agrees now or offers a time soon.</p>
            <Btn className="self-start" disabled={!topic.trim()} onClick={() => setI(0)}>Begin dialogue</Btn>
          </div>
        )}
        {st && (
          <div key={`${i}-${mores}`} className="flex flex-col gap-5 fade-in">
            <div className="flex items-center gap-3 flex-wrap">
              <Pill className={st.who === "sender" ? "bg-claysoft text-clay" : "bg-primary/10 text-primary"}>{speaker} {speaker === "You" ? "speak" : "speaks"}</Pill>
              <span className="text-sm text-muted">{st.who === "sender" ? receiver : sender} {st.who === "sender" ? (receiver === "You" ? "listen" : "listens") : (sender === "You" ? "listen" : "listens")}</span>
              <span className="ml-auto text-xs text-muted tnum">Step {i + 1} of 6{mores ? ` · ${mores} × more` : ""}</span>
            </div>
            <p className="eyebrow text-muted">{st.k}</p>
            <div className="flex flex-col gap-2">{st.stems.map((s) => <p key={s} className="font-display text-2xl md:text-3xl leading-snug">{s}</p>)}</div>
            <p className="text-sm text-muted">{st.tip}</p>
            <div className="flex flex-wrap gap-2 mt-auto">
              {i > 0 && <Btn variant="soft" onClick={() => setI(i - 1)}>Back</Btn>}
              {st.k === "Is there more?" ? (
                <><Btn variant="soft" onClick={() => { setMores(mores + 1); setI(0); }}>Yes, there's more</Btn><Btn onClick={() => setI(i + 1)}>No, that's all</Btn></>
              ) : i < 5 ? <Btn onClick={() => setI(i + 1)}>Next step</Btn> : (
                <><Btn onClick={() => finish(true)}>Switch roles</Btn><Btn variant="soft" onClick={() => finish(false)}>End dialogue</Btn></>
              )}
            </div>
          </div>
        )}
      </Card>
      <div className="flex flex-col gap-3">
        <Card className="p-5">
          <p className="eyebrow text-muted">Steps</p>
          <ol className="flex flex-col gap-1.5 mt-3">{STAGES.map((s, j) => <li key={s.k} className={`text-sm flex gap-2 ${j === i ? "font-semibold text-primary" : j < i ? "text-muted" : ""}`}><span className="tnum w-4">{j + 1}</span>{s.k}</li>)}</ol>
        </Card>
        {ex.dialogues.map((d) => <Card key={d.id} className="p-4 text-sm fade-in"><p className="text-xs text-muted">{d.date} · {d.sender === "You" ? "You" : PARTNER} sent</p><p className="font-semibold">{d.topic}</p></Card>)}
      </div>
    </div>
  );
}

/* Imago: Behavior change request */
function BCR({ ex, put, say }) {
  const blank = { frustration: "", desire: "", reqs: ["", "", ""], chosen: null };
  const [f, setF] = useState(blank);
  const setReq = (i, v) => setF({ ...f, reqs: f.reqs.map((x, j) => (j === i ? v : x)) });
  const ready = f.frustration.trim() && f.desire.trim() && f.reqs.every((r) => r.trim());
  const save = () => { put("bcr", (l) => [{ id: Date.now(), date: today(), ...f }, ...l]); setF(blank); say(`Saved. Read it to ${PARTNER} when you’re together.`, "small"); };
  return (
    <div className="grid lg:grid-cols-5 gap-5 items-start">
      <Card className="lg:col-span-3 p-5 md:p-6 flex flex-col gap-4">
        <Field htmlFor="bcr-f" label="1 · The frustration" hint="One behavior, described without blame."><textarea id="bcr-f" rows="2" className={inputCls} value={f.frustration} onChange={(e) => setF({ ...f, frustration: e.target.value })} placeholder="e.g. When plans change last-minute and I find out after…" /></Field>
        <Field htmlFor="bcr-d" label="2 · The desire underneath" hint="What you'd love to have instead."><textarea id="bcr-d" rows="2" className={inputCls} value={f.desire} onChange={(e) => setF({ ...f, desire: e.target.value })} placeholder="e.g. What I really want is to feel included in decisions about our time." /></Field>
        <div className="flex flex-col gap-2">
          <p className="text-sm font-semibold">3 · Three specific requests</p>
          <p className="text-xs text-muted -mt-1">Positive, doable, and measurable, with a time frame. Your partner picks one as a gift.</p>
          {f.reqs.map((r, i) => <input key={i} id={`bcr-r${i}`} className={inputCls} value={r} onChange={(e) => setReq(i, e.target.value)} placeholder={["e.g. Text me before 5 PM if evening plans change, for the next 2 weeks", "Request 2", "Request 3"][i]} />)}
        </div>
        <Btn className="self-start" disabled={!ready} onClick={save}>Save request</Btn>
      </Card>
      <div className="lg:col-span-2 flex flex-col gap-3">
        <Note title="A request, not a demand" tone="clay">Your partner chooses which request to give, and it's offered as a gift, not an obligation.</Note>
        {ex.bcr.length === 0 ? <Empty>Sent requests appear here with {PARTNER}'s choice.</Empty> : ex.bcr.map((b) => (
          <Card key={b.id} className="p-4 flex flex-col gap-2 fade-in text-sm">
            <p className="text-xs text-muted">{b.date}</p>
            <p className="italic">{b.desire}</p>
            {b.reqs.map((r, i) => (
              <label key={i} htmlFor={`bcr-c-${b.id}-${i}`} className={`flex gap-2 rounded-lg p-2 cursor-pointer ${b.chosen === i ? "bg-sagesoft" : ""}`}>
                <input id={`bcr-c-${b.id}-${i}`} type="radio" name={`bcr-${b.id}`} checked={b.chosen === i} onChange={() => { upd(put, "bcr", b.id, { chosen: i }); say(`Demo: ${PARTNER} chose request ${i + 1}`); }} />{r}
              </label>
            ))}
            <p className="text-xs text-muted">{b.chosen === null ? `Waiting for ${PARTNER} to choose (demo: pick one)` : `${PARTNER} chose request ${b.chosen + 1}`}</p>
          </Card>
        ))}
      </div>
    </div>
  );
}

      </Card>

        <Note title={`Unlocked by ${CLIENT.clinician.split(",")[0]} · Sep 22`}>This reflection can bring up painful memories. Go at your own pace and stop whenever you need to. It stays on this device. Bring it to session only if and when you want to.</Note>

    </div>
  );
}

function DelayTimer({ say }) {
  const [left, setLeft] = useState(0);
  useEffect(() => {
    if (left <= 0) return;
    const t = setTimeout(() => { setLeft(left - 1); if (left === 1) say("Delay finished. Check in: what do you need now?"); }, 1000);
    return () => clearTimeout(t);
  }, [left]);
  return left > 0 ? (
    <div className="flex items-center gap-3"><span className="font-display text-2xl tnum">{mmss(left)}</span><Btn variant="soft" onClick={() => setLeft(0)}>Stop</Btn><span className="text-xs text-muted">Try a HALT check or three slow breaths.</span></div>
  ) : (
    <div className="flex flex-wrap gap-2">{[5, 10].map((m) => <Btn key={m} variant="soft" onClick={() => setLeft(m * 60)}><Ico name="clock" className="w-4 h-4" /> Start {m}-minute delay</Btn>)}</div>
  );
}

function FoodLog({ ex, put, say }) {
  const MEALS = ["Breakfast", "Morning snack", "Lunch", "Afternoon snack", "Dinner", "Evening snack"];
  const FEEL = ["Calm", "Satisfied", "Rushed", "Stressed", "Distracted", "Anxious", "Guilty", "Proud"];
  const WHERE = ["At the table", "At my desk", "On the go", "In front of a screen", "With others"];
  const blank = { meal: "Lunch", what: "", hunger: 0, full: 0, feelings: [], where: "", note: "" };
  const [f, setF] = useState(blank);
  const save = () => { if (!f.what.trim()) { say("Add what you ate first"); return; } put("food", (l) => [{ id: Date.now(), date: nowStamp(), ...f }, ...l]); setF(blank); say("Meal logged", "small"); };
  const Scale = ({ label, k, ends }) => (
    <div className="flex flex-col gap-1.5">
      <p className="text-sm font-semibold">{label}</p>
      <div className="grid grid-cols-5 gap-1.5" role="radiogroup" aria-label={label}>
        {[1, 2, 3, 4, 5].map((n) => <button key={n} role="radio" aria-checked={f[k] === n} onClick={() => setF({ ...f, [k]: n })} className={`rounded-lg py-2 text-sm font-semibold tnum border ${f[k] === n ? "bg-primary text-onprimary border-primary" : "border-line hover:bg-surface2"}`}>{n}</button>)}
      </div>
      <div className="flex justify-between text-[11px] text-muted"><span>{ends[0]}</span><span>{ends[1]}</span></div>
    </div>
  );
  const today = ex.food.filter((x) => x.date.startsWith("Sun"));
  return (
    <div className="grid lg:grid-cols-5 gap-5 items-start">
      <Card className="lg:col-span-3 p-5 md:p-6 flex flex-col gap-4">
        <div className="flex flex-col gap-2"><p className="text-sm font-semibold">Meal or snack</p><Chips options={MEALS} value={f.meal} onChange={(v) => setF({ ...f, meal: v })} /></div>
        <Field htmlFor="fd-what" label="What I ate"><textarea id="fd-what" rows="2" className={inputCls} value={f.what} onChange={(e) => setF({ ...f, what: e.target.value })} placeholder="Describe it in your own words" /></Field>
        <div className="grid sm:grid-cols-2 gap-4">
          <Scale label="Hunger before" k="hunger" ends={["Not hungry", "Very hungry"]} />
          <Scale label="Fullness after" k="full" ends={["Still hungry", "Uncomfortably full"]} />
        </div>
        <div className="flex flex-col gap-2"><p className="text-sm font-semibold">How I felt</p><Chips multi options={FEEL} value={f.feelings} onChange={(v) => setF({ ...f, feelings: v })} tone="sage" /></div>
        <div className="flex flex-col gap-2"><p className="text-sm font-semibold">Where I ate</p><Chips options={WHERE} value={f.where} onChange={(v) => setF({ ...f, where: v })} tone="clay" /></div>
        <Field htmlFor="fd-note" label="Anything else (optional)"><input id="fd-note" className={inputCls} value={f.note} onChange={(e) => setF({ ...f, note: e.target.value })} /></Field>
        <Btn className="self-start" onClick={save}>Log meal</Btn>
      </Card>
      <div className="lg:col-span-2 flex flex-col gap-3">
        <Note title="No numbers, no rules" tone="sage">This log never asks for calories, portions, or weight. It's about eating regularly and noticing hunger, fullness, and feelings. If you're working on eating disorder recovery, use it only in the way your care team suggests.</Note>
        <Card className="p-5 flex flex-col gap-2">
          <p className="eyebrow text-muted">Today</p>
          <div className="flex flex-wrap gap-1.5">
            {["Breakfast", "Lunch", "Dinner"].map((m) => {
              const done = today.some((x) => x.meal === m);
              return <Pill key={m} className={done ? "bg-sage text-white" : "bg-surface2 text-muted"}>{done && <Ico name="check" className="w-3.5 h-3.5" />}{m}</Pill>;
            })}
            {today.filter((x) => x.meal.includes("snack")).length > 0 && <Pill className="bg-sage text-white">{today.filter((x) => x.meal.includes("snack")).length} snack(s)</Pill>}
          </div>
        </Card>
        {ex.food.map((x) => (
          <Card key={x.id} className="p-4 text-sm flex flex-col gap-1.5 fade-in">
            <div className="flex justify-between gap-2"><span className="font-semibold">{x.meal}</span><span className="text-xs text-muted">{x.date}</span></div>
            <p>{x.what}</p>
            <p className="text-xs text-muted tnum">{x.hunger ? `Hunger ${x.hunger}/5` : ""}{x.hunger && x.full ? " · " : ""}{x.full ? `Fullness ${x.full}/5` : ""}{x.where ? ` · ${x.where}` : ""}</p>
            {x.feelings.length > 0 && <div className="flex flex-wrap gap-1.5">{x.feelings.map((c) => <Pill key={c} className="bg-sagesoft text-sage">{c}</Pill>)}</div>}
            {x.note && <p className="text-xs italic">{x.note}</p>}
          </Card>
        ))}
      </div>
    </div>
  );
}

function MedLog({ ex, put, say }) {
  const EFFECTS = ["None", "Nausea", "Headache", "Drowsiness", "Trouble sleeping", "Dizziness", "Restlessness", "Appetite change", "Other"];
  const [adding, setAdding] = useState(false);
  const [m, setM] = useState({ name: "", dose: "", when: "Morning", prescriber: "", refill: "" });
  const [c, setC] = useState({ mood: 5, sleep: "", effects: [], note: "" });
  const doses = ex.doses;
  const setDose = (id, patch) => put("doses", { ...doses, [id]: { ...(doses[id] || {}), ...patch } });
  const nowT = () => new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  const scheduled = ex.meds.filter((x) => !x.prn);
  const takenCount = scheduled.filter((x) => doses[x.id] && doses[x.id].taken).length;
  return (
    <div className="grid lg:grid-cols-5 gap-5 items-start">
      <div className="lg:col-span-3 flex flex-col gap-4">
        <Card className="p-5 md:p-6 flex flex-col gap-3">
          <div className="flex items-baseline justify-between"><p className="font-display text-2xl">Today's medications</p><span className="text-sm text-muted tnum">{takenCount}/{scheduled.length} scheduled taken</span></div>
          {ex.meds.map((x) => {
            const d = doses[x.id] || {};
            return (
              <div key={x.id} className="rounded-xl border border-line p-3.5 flex flex-wrap items-center gap-3">
                <div className="flex-1 min-w-[160px]">
                  <p className="font-semibold">{x.name} <span className="font-normal text-muted">· {x.dose}</span></p>
                  <p className="text-xs text-muted">{x.when}{x.prescriber ? ` · ${x.prescriber}` : ""}{x.refill ? ` · Refill by ${x.refill}` : ""}</p>
                </div>
                {d.taken ? (
                  <div className="flex items-center gap-2">
                    <Pill className="bg-sage text-white"><Ico name="check" className="w-3.5 h-3.5" />Taken {d.time}</Pill>
                    <button onClick={() => setDose(x.id, { taken: false, skipped: false, time: "" })} className="text-xs text-muted hover:text-ink underline">Undo</button>
                  </div>
                ) : d.skipped ? (
                  <div className="flex items-center gap-2"><Pill className="bg-claysoft text-clay">Skipped</Pill><button onClick={() => setDose(x.id, { skipped: false })} className="text-xs text-muted hover:text-ink underline">Undo</button></div>
                ) : (
                  <div className="flex gap-2">
                    <Btn onClick={() => { setDose(x.id, { taken: true, time: nowT() }); say(`${x.name} logged`, "small"); }}>{x.prn ? "Took a dose" : "Mark taken"}</Btn>
                    {!x.prn && <Btn variant="soft" onClick={() => setDose(x.id, { skipped: true })}>Skipped</Btn>}
                  </div>
                )}
              </div>
            );
          })}
          {adding ? (
            <div className="rounded-xl bg-surface2 p-4 grid sm:grid-cols-2 gap-3 fade-in">
              <Field htmlFor="md-name" label="Medication"><input id="md-name" className={inputCls} value={m.name} onChange={(e) => setM({ ...m, name: e.target.value })} /></Field>
              <Field htmlFor="md-dose" label="Dose as prescribed"><input id="md-dose" className={inputCls} value={m.dose} onChange={(e) => setM({ ...m, dose: e.target.value })} placeholder="e.g. 10 mg" /></Field>
              <Field htmlFor="md-when" label="When"><select id="md-when" className={inputCls} value={m.when} onChange={(e) => setM({ ...m, when: e.target.value })}>{["Morning", "Midday", "Evening", "Bedtime", "Twice a day", "As needed"].map((w) => <option key={w}>{w}</option>)}</select></Field>
              <Field htmlFor="md-pres" label="Prescriber"><input id="md-pres" className={inputCls} value={m.prescriber} onChange={(e) => setM({ ...m, prescriber: e.target.value })} /></Field>
              <Field htmlFor="md-refill" label="Refill by (optional)"><input id="md-refill" className={inputCls} value={m.refill} onChange={(e) => setM({ ...m, refill: e.target.value })} placeholder="e.g. Oct 30" /></Field>
              <div className="flex items-end gap-2">
                <Btn disabled={!m.name.trim()} onClick={() => { put("meds", (l) => [...l, { id: Date.now(), ...m, prn: m.when === "As needed" }]); setM({ name: "", dose: "", when: "Morning", prescriber: "", refill: "" }); setAdding(false); say("Medication added", "small"); }}>Add</Btn>
                <Btn variant="ghost" onClick={() => setAdding(false)}>Cancel</Btn>
              </div>
            </div>
          ) : <Btn variant="ghost" className="self-start" onClick={() => setAdding(true)}><Ico name="plus" className="w-4 h-4" /> Add a medication</Btn>}
        </Card>
        <Card className="p-5 md:p-6 flex flex-col gap-4">
          <p className="font-display text-xl">Daily check-in</p>
          <Slider id="md-mood" label="Mood (1–10)" value={c.mood} onChange={(v) => setC({ ...c, mood: v })} min={1} max={10} />
          <Field htmlFor="md-sleep" label="Hours of sleep"><input id="md-sleep" inputMode="decimal" className={`${inputCls} max-w-[120px]`} value={c.sleep} onChange={(e) => setC({ ...c, sleep: e.target.value })} /></Field>
          <div className="flex flex-col gap-2"><p className="text-sm font-semibold">Side effects today</p><Chips multi options={EFFECTS} value={c.effects} onChange={(v) => setC({ ...c, effects: v })} tone="clay" /></div>
          <Field htmlFor="md-note" label="Something to tell my prescriber"><textarea id="md-note" rows="2" className={inputCls} value={c.note} onChange={(e) => setC({ ...c, note: e.target.value })} /></Field>
          <Btn className="self-start" onClick={() => { put("medNotes", (l) => [{ id: Date.now(), date: nowStamp(), ...c }, ...l]); setC({ mood: 5, sleep: "", effects: [], note: "" }); say("Check-in saved", "small"); }}>Save check-in</Btn>
        </Card>
      </div>
      <div className="lg:col-span-2 flex flex-col gap-3">
        <Note title="Safety note" tone="clay">Never start, stop, or change a dose on your own, even if you feel better. Talk with your prescriber first. If you think you've taken too much, call Poison Control at 1-800-222-1222, or 911 if someone is unresponsive or struggling to breathe.</Note>
        <p className="text-xs text-muted px-1">This log is saved only on this device. Bring it to appointments with your prescriber. It doesn't give medical advice, and MindShift therapists don't prescribe; your prescriber manages your medication.</p>
        <p className="eyebrow text-muted mt-1">Recent check-ins</p>
        {ex.medNotes.map((x) => (
          <Card key={x.id} className="p-4 text-sm flex flex-col gap-1.5 fade-in">
            <div className="flex justify-between gap-2"><span className="text-xs text-muted">{x.date}</span><span className="text-xs tnum">Mood <b>{x.mood}</b>/10{x.sleep ? ` · ${x.sleep} h sleep` : ""}</span></div>
            {x.effects.length > 0 && <div className="flex flex-wrap gap-1.5">{x.effects.map((e) => <Pill key={e} className="bg-claysoft text-clay">{e}</Pill>)}</div>}
            {x.note && <p>{x.note}</p>}
          </Card>
        ))}
      </div>
    </div>
  );
}

function CouplesSplit({ say, put }) {
  const blank = { mood: 0, topic: "", appreciation: "", need: "", ready: false };
  const [a, setA] = useState(blank);
  const [b, setB] = useState({ mood: 3, topic: "Planning the holidays with both families", appreciation: "", need: "", ready: false });
  const [to, setTo] = useState(CLIENT.clinician);
  const [view, setView] = useState("both");
  const both = a.ready && b.ready;
  const Pane = ({ who, tone, d, set, idp, demo }) => (
    <div className={`rounded-2xl border-2 p-4 md:p-5 flex flex-col gap-4 ${tone === "clay" ? "border-clay/40" : "border-primary/30"}`}>
      <div className="flex items-center gap-3">
        <span className={`w-10 h-10 rounded-full grid place-items-center font-display text-lg text-white ${tone === "clay" ? "bg-clay" : "bg-primary"}`}>{who[0]}</span>
        <div className="flex-1"><p className="font-semibold">{who}</p><p className="text-xs text-muted">{demo ? `${who} fills this in on this phone` : "Your side"}</p></div>
        {d.ready && <Pill className="bg-sage text-white"><Ico name="check" className="w-3.5 h-3.5" />Ready</Pill>}
      </div>
      {d.ready && !both ? (
        <div className="rounded-xl bg-surface2 p-4 text-sm flex items-center gap-2"><Ico name="lock" className="w-4 h-4 text-muted" />Answers hidden until both partners are ready.</div>
      ) : (
        <>
          <div className="flex flex-col gap-2">
            <p className="text-sm font-semibold">How am I feeling about us this week?</p>
            <div className="grid grid-cols-5 gap-1.5">{[1, 2, 3, 4, 5].map((n) => <button key={n} disabled={d.ready} aria-pressed={d.mood === n} onClick={() => set({ ...d, mood: n })} className={`rounded-lg py-2 text-sm font-semibold tnum border ${d.mood === n ? (tone === "clay" ? "bg-clay text-white border-clay" : "bg-primary text-onprimary border-primary") : "border-line hover:bg-surface2"}`}>{n}</button>)}</div>
            <div className="flex justify-between text-[11px] text-muted"><span>Disconnected</span><span>Close</span></div>
          </div>
          {[["topic", "What I'd like to talk about"], ["appreciation", "One thing I appreciated this week"], ["need", "What I need from this session"]].map(([k, l]) => (
            <Field key={k} htmlFor={`${idp}-${k}`} label={l}><textarea id={`${idp}-${k}`} rows="2" disabled={d.ready} className={inputCls} value={d[k]} onChange={(e) => set({ ...d, [k]: e.target.value })} /></Field>
          ))}
          {!d.ready && <Btn className="self-start" disabled={!d.mood} onClick={() => { set({ ...d, ready: true }); const other = who === "You" ? b.ready : a.ready; say(other ? "You\u2019re both ready for your session!" : `${who} is ready`, other ? "big" : "small"); }}>I'm ready</Btn>}
        </>
      )}
    </div>
  );
  return (
    <div className="flex flex-col gap-5">
      <div className="flex flex-wrap items-end gap-4">
        <div className="flex-1 min-w-[240px] max-w-md"><ClinicianSelect id="cs-to" value={to} onChange={setTo} label="Couples therapist" /></div>
        <div className="inline-flex rounded-full bg-surface2 p-1 md:hidden" role="tablist">
          {[["both", "Both"], ["you", "You"], ["sam", PARTNER]].map(([k, l]) => <button key={k} role="tab" aria-selected={view === k} onClick={() => setView(k)} className={`rounded-full px-3.5 py-1.5 text-sm font-semibold ${view === k ? "bg-surface shadow-sm" : "text-muted"}`}>{l}</button>)}
        </div>
      </div>
      {both && (
        <div className="rounded-2xl bg-sagesoft p-4 flex flex-wrap items-center gap-3 fade-in">
          <Ico name="check" className="w-5 h-5 text-sage" />
          <p className="flex-1 text-sm"><b>You're both ready.</b> Your answers are now visible to each other. Add them to your session summary to go over with {firstName(to)}.</p>
          <Btn onClick={() => { put("prep", { a, b }); say("Added to your session summary", "small"); }}>Add to session summary</Btn>
        </div>
      )}
      <div className="grid md:grid-cols-2 gap-4 items-start">
        <div className={view === "sam" ? "hidden md:block" : ""}>{Pane({ who: "You", tone: "primary", d: a, set: setA, idp: "cp-a" })}</div>
        <div className={view === "you" ? "hidden md:block" : ""}>{Pane({ who: PARTNER, tone: "clay", d: b, set: setB, idp: "cp-b", demo: true })}</div>
      </div>
      <p className="text-xs text-muted">Take turns on this device. Neither of you sees the other's answers until you've both tapped “I'm ready.” Nothing is sent anywhere.</p>
    </div>
  );
}

function WorkshopViewer({ setOpenDoc, lib, setLib, say }) {
  const ws = lib.workshop || { done: {}, notes: {} };
  const setWs = (fn) => setLib((l) => ({ ...l, workshop: fn(l.workshop || { done: {}, notes: {} }) }));
  const firstOpen = WORKSHOP.phases.findIndex((ph, pi) => ph.sections.some((_, si) => !ws.done[wsKey(pi, si)]));
  const [pi, setPi] = useState(firstOpen === -1 ? 0 : firstOpen);
  const [open, setOpen] = useState(null);
  const ph = WORKSHOP.phases[pi];
  const phaseDone = (i) => WORKSHOP.phases[i].sections.every((_, si) => ws.done[wsKey(i, si)]);
  const total = WORKSHOP.phases.reduce((n, p) => n + p.sections.length, 0);
  const doneCount = Object.values(ws.done).filter(Boolean).length;
  const complete = (si) => {
    const k = wsKey(pi, si);
    const nowDone = { ...ws.done, [k]: true };
    setWs((w) => ({ ...w, done: { ...w.done, [k]: true } }));
    const allPhase = ph.sections.every((_, j) => nowDone[wsKey(pi, j)]);
    const allProgram = WORKSHOP.phases.every((p, i) => p.sections.every((_, j) => nowDone[wsKey(i, j)]));
    if (allProgram) say("You completed the entire workshop!", "big");
    else if (allPhase) say(`Phase ${pi + 1} complete! On to Phase ${pi + 2}.`, "big");
    else say(`Section complete: ${ph.sections[si].t}`, "big");
    setOpen(null);
  };
  const note = (k, who, v) => setWs((w) => ({ ...w, notes: { ...w.notes, [`${k}-${who}`]: v } }));
  return (
    <div className="flex flex-col gap-5 fade-in">
      <div className="flex items-center gap-3 flex-wrap">
        <Btn variant="soft" onClick={() => setOpenDoc(null)}><Ico name="back" className="w-4 h-4" /> Library</Btn>
        <span className="font-display text-lg">{WORKSHOP.title}</span>
        <span className="ml-auto text-sm text-muted tnum">{doneCount} of {total} sections</span>
      </div>
      <div className="h-2 rounded-full bg-surface2 overflow-hidden"><div className="h-full bg-sage transition-all" style={{ width: `${(doneCount / total) * 100}%` }} /></div>
      <div className="grid grid-cols-5 gap-2" role="tablist" aria-label="Phases">
        {WORKSHOP.phases.map((p, i) => (
          <button key={i} role="tab" aria-selected={pi === i} onClick={() => { setPi(i); setOpen(null); }} className={`rounded-2xl border p-2.5 md:p-3 text-left transition ${pi === i ? "border-primary bg-primary/5" : "border-line hover:bg-surface2"}`}>
            <span className="flex items-center gap-2"><span className={`w-7 h-7 rounded-full grid place-items-center text-sm font-bold tnum shrink-0 ${phaseDone(i) ? "bg-sage text-white" : pi === i ? "bg-primary text-onprimary" : "bg-surface2"}`}>{phaseDone(i) ? <Ico name="check" className="w-4 h-4" /> : i + 1}</span><span className="hidden md:block text-xs font-semibold leading-tight">{p.t}</span></span>
          </button>
        ))}
      </div>
      <Card className="p-5 md:p-7 flex flex-col gap-4">
        <div>
          <p className="eyebrow text-sage">Phase {pi + 1} of 5</p>
          <h2 className="font-display text-3xl mt-1">{ph.t}</h2>
          <p className="text-muted mt-2 max-w-2xl">{ph.note}</p>
          {pi > 0 && !phaseDone(pi - 1) && <p className="text-xs text-clay font-semibold mt-2">Tip: finish Phase {pi} first. Each phase builds on the one before it.</p>}
        </div>
        {ph.sections.map((s, si) => {
          const k = wsKey(pi, si), d = ws.done[k], isOpen = open === si;
          return (
            <div key={k} className={`rounded-2xl border ${d ? "border-sage/50 bg-sagesoft/40" : "border-line"}`}>
              <button onClick={() => setOpen(isOpen ? null : si)} aria-expanded={isOpen} className="w-full text-left p-4 flex items-center gap-3">
                <span className={`w-8 h-8 rounded-full grid place-items-center text-sm font-bold tnum shrink-0 ${d ? "bg-sage text-white" : "bg-surface2"}`}>{d ? <Ico name="check" className="w-4 h-4" /> : si + 1}</span>
                <span className="flex-1"><span className="font-semibold block">{s.t}</span><span className="text-xs text-muted">{s.f}</span></span>
                <Ico name="chevron" className={`w-4 h-4 text-muted transition ${isOpen ? "rotate-90" : ""}`} />
              </button>
              {isOpen && (
                <div className="px-4 pb-4 md:pl-15 flex flex-col gap-4 fade-in">
                  <p className="leading-relaxed">{s.d}</p>
                  <div className="grid md:grid-cols-2 gap-3">
                    {[["You", "primary"], [PARTNER, "clay"]].map(([who, tone]) => (
                      <div key={who} className={`rounded-xl border-2 p-3 flex flex-col gap-2 ${tone === "clay" ? "border-clay/35" : "border-primary/25"}`}>
                        <p className="text-sm font-semibold flex items-center gap-2"><span className={`w-6 h-6 rounded-full grid place-items-center text-xs text-white ${tone === "clay" ? "bg-clay" : "bg-primary"}`}>{who[0]}</span>{who}</p>
                        {s.q.map((q, qi) => (
                          <div key={qi} className="flex flex-col gap-1">
                            <label htmlFor={`ws-${k}-${who}-${qi}`} className="text-xs text-muted">{q}</label>
                            <textarea id={`ws-${k}-${who}-${qi}`} rows="2" className={inputCls} value={ws.notes[`${k}-${who}-${qi}`] || ""} onChange={(e) => note(k, `${who}-${qi}`, e.target.value)} />
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                  {d ? <p className="text-sm text-sage font-semibold flex items-center gap-1"><Ico name="check" className="w-4 h-4" /> Completed. Come back to practice anytime.</p>
                    : <Btn className="self-start" onClick={() => complete(si)}><Ico name="check" className="w-4 h-4" /> We completed this section</Btn>}
                </div>
              )}
            </div>
          );
        })}
      </Card>
      <p className="text-xs text-muted max-w-3xl">Educational material, not a substitute for couples therapy. Not intended for relationships involving violence, threats, or coercion; if that's part of your relationship, use “Get help now” or call the National Domestic Violence Hotline at 1-800-799-7233.</p>
    </div>
  );
}

function SessionTimeout({ onSignOut }) {
  const last = useRef(Date.now());
  const [left, setLeft] = useState(null);
  useEffect(() => {
    const bump = () => { if (left === null) last.current = Date.now(); };
    const evs = ["mousemove", "keydown", "click", "touchstart", "scroll"];
    evs.forEach((e) => window.addEventListener(e, bump, { passive: true }));
    const t = setInterval(() => {
      const idle = (Date.now() - last.current) / 1000;
      if (idle >= IDLE_LIMIT) onSignOut("timeout");
      else if (idle >= IDLE_LIMIT - IDLE_WARN) setLeft(Math.ceil(IDLE_LIMIT - idle));
    }, 1000);
    return () => { evs.forEach((e) => window.removeEventListener(e, bump)); clearInterval(t); };
  }, [left]);
  if (left === null) return null;
  return (
    <div className="fixed inset-0 z-[70] bg-ink/50 grid place-items-center p-4" role="alertdialog" aria-modal="true" aria-label="Session expiring">
      <div className="bg-surface rounded-3xl p-6 max-w-sm w-full flex flex-col gap-4 fade-in">
        <p className="font-display text-2xl">Still there?</p>
        <p className="text-sm text-muted">For your privacy, you'll be signed out in <b className="text-ink tnum">{left} seconds</b>.</p>
        <div className="flex gap-2"><Btn onClick={() => { last.current = Date.now(); setLeft(null); }}>Stay signed in</Btn><Btn variant="soft" onClick={() => onSignOut("manual")}>Sign out</Btn></div>
      </div>
    </div>
  );
}

function PinPad({ title, sub, onDone, error, tone = "dark" }) {
  const [v, setV] = useState("");
  const press = (d) => setV((x) => {
    const n = (x + d).slice(0, 4);
    if (n.length === 4) setTimeout(() => { onDone(n); setV(""); }, 120);
    return n;
  });

    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, []);

function AppLock({ pin, setPin, locked, setLocked, signOut, openCrisis }) {
  const [first, setFirst] = useState(null);
  const [err, setErr] = useState("");
  useEffect(() => {
    if (!pin || locked) return;
    let last = Date.now();
    const bump = () => { last = Date.now(); };
    const evs = ["mousemove", "keydown", "click", "touchstart", "scroll"];
    evs.forEach((e) => window.addEventListener(e, bump, { passive: true }));
    const t = setInterval(() => { if (Date.now() - last > LOCK_IDLE_MIN * 60 * 1000) setLocked(true); }, 1000);
    return () => { evs.forEach((e) => window.removeEventListener(e, bump)); clearInterval(t); };
  }, [pin, locked]);
  if (pin && !locked) return null;
  const shell = (children) => (
    <div className="fixed inset-0 z-[60] bg-primary text-onprimary overflow-y-auto" role="dialog" aria-modal="true" aria-label={pin ? "App locked" : "Set up app lock"}>
      <div className="min-h-full flex flex-col items-center justify-center gap-6 px-4 py-10">
        <div className="text-center"><div className="font-display text-3xl font-semibold">Mind<span className="italic font-normal opacity-80">Shift</span></div></div>
        {children}
        <button onClick={openCrisis} className="rounded-full border border-onprimary/40 px-4 py-2 text-sm font-semibold hover:bg-onprimary/10">Get help now · 911 · 988</button>
      </div>
    </div>
  );
  if (!pin) return shell(
    <>
      <p className="text-sm opacity-85 max-w-sm text-center">Your journals, logs, and check-ins are saved only on this device. Add a passcode so no one else who picks up your phone can open them.</p>
      {first === null
        ? <PinPad title="Create a 4-digit passcode" onDone={(v) => { setFirst(v); setErr(""); }} error={err} />
        : <PinPad title="Confirm your passcode" onDone={(v) => { if (v === first) { setPin(v); setLocked(false); } else { setErr("Those didn't match. Try again."); setFirst(null); } }} error={err} />}
      <button onClick={() => { setPin("faceid"); setLocked(false); }} className="text-sm font-semibold underline underline-offset-4">Use Face ID instead (demo)</button>
    </>
  );
  return shell(
    <>
      <PinPad title="Enter your passcode" sub={`Locked after ${LOCK_IDLE_MIN} minutes of inactivity`} onDone={(v) => { if (pin === "faceid" || v === pin) { setLocked(false); setErr(""); } else setErr("Wrong passcode. Try again."); }} error={err} />
      <button onClick={() => { setLocked(false); setErr(""); }} className="text-sm font-semibold underline underline-offset-4">Unlock with Face ID (demo)</button>
      <button onClick={() => signOut("manual")} className="text-xs opacity-75 hover:opacity-100">Forgot your passcode? Sign out and sign back in to reset it.</button>
    </>
  );
}

                    <div className="flex flex-wrap gap-2 items-end">
                      <div className="flex-1 min-w-[220px] flex flex-col gap-1.5"><label htmlFor="assign-res" className="text-sm font-semibold">Assign a resource</label>
                        <select id="assign-res" className={inputCls} value={pick} onChange={(e) => setPick(e.target.value)}>{ALL_RES.map((r) => <option key={r.id} value={r.id}>{r.track} · {r.title}</option>)}</select></div>
                      <Btn onClick={assign}>Assign</Btn>
                    </div>
                    <p className="text-xs text-muted">The client gets a notification in the app. You'll see only that it was assigned, not what they write.</p>
                  </Card>
                )}
              </div>
            </div>
          )}
          {page === "audit" && (
            <>
              <h1 className="font-display text-3xl">Access log</h1>
              <p className="text-sm text-muted max-w-2xl">Every time staff open a client record or assign a resource, it's recorded here with who, what, and when. Logs can't be edited or deleted.</p>
              <div className="overflow-x-auto rounded-2xl border border-line bg-surface">
                <table className="w-full text-sm">
                  <thead><tr className="text-left text-xs text-muted border-b border-line">{["When", "Who", "Role", "Action", "Record"].map((h) => <th key={h} className="px-4 py-3 font-semibold">{h}</th>)}</tr></thead>
                  <tbody>{audit.map((a) => <tr key={a.id} className="border-b border-line last:border-0"><td className="px-4 py-2.5 whitespace-nowrap tnum">{a.when}</td><td className="px-4 py-2.5 whitespace-nowrap">{a.who}</td><td className="px-4 py-2.5">{a.role}</td><td className="px-4 py-2.5">{a.action}</td><td className="px-4 py-2.5">{a.record}</td></tr>)}</tbody>
                </table>
              </div>
            </>
          )}
        </main>
      </div>
    </div>
  );
}

function WorryWindow({ worries, setWorries, worryDone, setWorryDone, say }) {
  const [txt, setTxt] = useState("");
  const [time, setTime] = useState("6:30 PM");
  const [mode, setMode] = useState("collect");
  const add = () => { if (!txt.trim()) return; setWorries([...worries, { id: Date.now(), text: txt.trim(), kind: null, step: "" }]); setTxt(""); };
  const upd = (id, k, v) => setWorries(worries.map((w) => (w.id === id ? { ...w, [k]: v } : w)));
  const sorted = worries.every((w) => w.kind);
  return (
    <div className="grid lg:grid-cols-3 gap-5 items-start">
      <div className="lg:col-span-2 flex flex-col gap-4">
        <div className="inline-flex rounded-full bg-surface2 p-1 self-start" role="tablist">
          {[["collect", "1 · Park worries"], ["review", "2 · Worry window"]].map(([id, l]) => (
            <button key={id} role="tab" aria-selected={mode === id} onClick={() => setMode(id)} className={`rounded-full px-4 py-1.5 text-sm font-semibold ${mode === id ? "bg-surface shadow-sm" : "text-muted"}`}>{l}</button>
          ))}
        </div>
        {mode === "collect" ? (
          <Card className="p-5 md:p-6 flex flex-col gap-4">
            <p className="text-sm text-muted">When a worry shows up during the day, jot it here and let it wait for your window.</p>
            <form className="flex gap-2" onSubmit={(e) => { e.preventDefault(); add(); }}>
              <input id="w-new" className={inputCls} value={txt} onChange={(e) => setTxt(e.target.value)} placeholder="Park a worry…" />
              <Btn type="submit" aria-label="Add worry"><Ico name="plus" className="w-4 h-4" /></Btn>
            </form>
            <ul className="flex flex-col gap-2">
              {worries.map((w) => (
                <li key={w.id} className="flex items-center gap-3 rounded-xl bg-surface2 px-3.5 py-2.5 text-sm fade-in">
                  <span className="flex-1">{w.text}</span>
                  <button onClick={() => setWorries(worries.filter((x) => x.id !== w.id))} aria-label="Remove" className="text-muted hover:text-danger"><Ico name="x" className="w-4 h-4" /></button>
                </li>
              ))}
            </ul>
          </Card>
        ) : (
          <Card className="p-5 md:p-6 flex flex-col gap-4">
            <p className="text-sm text-muted">Spend up to 15 minutes. For each worry, decide whether it's something you can act on.</p>
            {worries.map((w) => (
              <div key={w.id} className="rounded-xl border border-line p-4 flex flex-col gap-3">
                <p className="font-semibold">{w.text}</p>
                <div className="flex flex-wrap gap-2">
                  {[["act", "I can act on this"], ["let", "Outside my control"]].map(([k, l]) => (
                    <button key={k} onClick={() => upd(w.id, "kind", k)} aria-pressed={w.kind === k} className={`rounded-full px-3.5 py-1.5 text-sm font-semibold border ${w.kind === k ? (k === "act" ? "bg-sage text-white border-sage" : "bg-primary text-onprimary border-primary") : "border-line hover:bg-surface2"}`}>{l}</button>
                  ))}
                </div>
                {w.kind === "act" && <input id={`w-step-${w.id}`} className={inputCls} placeholder="One small next step, and when" value={w.step} onChange={(e) => upd(w.id, "step", e.target.value)} />}
                {w.kind === "let" && <p className="text-sm text-muted">Notice it, name it, and let it rest until tomorrow's window.</p>}
              </div>
            ))}
            <Btn disabled={!sorted || worryDone} className="self-start" onClick={() => { setWorryDone(true); say("Worry window complete", "big"); }}>{worryDone ? "Completed today" : "Close my worry window"}</Btn>
          </Card>
        )}
      </div>
      <div className="flex flex-col gap-4">
        <Card className="p-5 flex flex-col gap-3">
          <p className="eyebrow text-muted">Today's window</p>
          <label htmlFor="w-time" className="text-sm font-semibold">Time</label>
          <select id="w-time" className={inputCls} value={time} onChange={(e) => setTime(e.target.value)}>
            {["5:00 PM", "6:30 PM", "7:30 PM", "8:00 PM"].map((t) => <option key={t}>{t}</option>)}
          </select>
          <p className="text-sm text-muted">15 minutes, not right before bed.</p>
          <Btn variant="soft" onClick={() => say(`Reminder set for ${time}`)}><Ico name="clock" className="w-4 h-4" /> Remind me at {time}</Btn>
        </Card>
        <div className="rounded-2xl bg-claysoft/60 p-4 text-sm">
          <p className="font-semibold">Note from {CLIENT.clinician.split(",")[0]}</p>
          <p className="mt-1 italic">“Let's try this for the week before your presentation. Bring your list Tuesday.”</p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
